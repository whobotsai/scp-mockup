/* ===================== CREATE WIZARD (SHO / SSO) ===================== */

const SHO_STEPS = ['Token & amount','Reward & ranking','Duration','Milestones','Review'];
const SSO_STEPS = ['Token & amount','Reward & keyword','Epoch & size','Duration & split','Review'];

function CreateWizard({kind, go, user, notify}){
  const isSHO = kind==='sho';
  const steps = isSHO ? SHO_STEPS : SSO_STEPS;
  const [step,setStep] = useState(0);
  const [submitting, setSubmitting] = useState(null); // null | 'approving' | 'creating'
  const [form,setForm] = useState({
    contract:'', token:'',
    amount:'10000000', denom:'token', window:'7D', size:100,
    duration:'30D', keyword:'$MYTOKEN', epochLen:'7D',
    ms: {'100K':2000,'250K':3000,'1M':2500,'5M':2500},
    msOn: {'100K':true,'250K':true,'1M':true,'5M':true},
  });
  const set = (k,v)=> setForm(f=>({...f,[k]:v}));

  // Debounced live lookup against ../api's GET /tokens/:address -- replaces the old
  // hand-authored TOKEN_REGISTRY map (see api/src/tokenRoutes.js's own header on why this is
  // "sourced from the real chain instead of a hand-authored map" now).
  const [debouncedAddr, setDebouncedAddr] = useState('');
  useEffect(()=>{
    const t = setTimeout(()=> setDebouncedAddr(form.contract.trim()), 400);
    return ()=>clearTimeout(t);
  }, [form.contract]);
  const validAddr = window.ethers && window.ethers.isAddress(debouncedAddr);
  const tokenLookup = useApiFetch(validAddr ? `/tokens/${debouncedAddr}` : null, [validAddr, debouncedAddr]);
  const resolved = tokenLookup.data;

  useEffect(()=>{
    if(resolved) setForm(f=> f.token===resolved.ticker ? f : {...f, token:resolved.ticker});
  }, [resolved]);

  const denomLabel = form.denom==='token' ? (resolved?resolved.ticker:form.token) : form.denom.toUpperCase();

  if(!user.wallet){
    return (
      <div className="page">
        <div className="wrap" style={{maxWidth:520}}>
          <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / <button onClick={()=>go(`/${kind}`)}>{isSHO?'SHO':'SSO'}</button> / New</div>
          <div className="empty-state">
            <h3>Connect a wallet to create a campaign</h3>
            <p>The connected wallet becomes the on-chain creator of record and locks the reward pool, so it has to be set before you can configure a campaign.</p>
            <div style={{marginTop:16}}><Btn icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn></div>
          </div>
        </div>
      </div>
    );
  }

  const totalBps = MS_TIERS.reduce((s,t)=> s + (form.msOn[t.id] ? Number(form.ms[t.id]||0) : 0), 0);
  const bpsOk = totalBps===10000;

  const next = ()=> setStep(s=>Math.min(steps.length-1,s+1));
  const back = ()=> setStep(s=>Math.max(0,s-1));

  const windowEnumOf = (v)=> v==='24H'?0:v==='7D'?1:2; // Types.LeaderboardWindow / EpochLength ordering
  const durationSecondsOf = (v)=> v==='7D'?7*86400:v==='30D'?30*86400:90*86400;

  // Resolves rewardToken address + the decimals `amount` must be parsed in -- these are
  // whatever the *reward* denomination uses, not necessarily the tracked token's decimals.
  async function resolveRewardToken(){
    if(form.denom==='eth') return {address: window.ethers.ZeroAddress, decimals: 18};
    if(form.denom==='usdc'){
      if(!SCP_CONFIG.USDC_ADDRESS) throw new Error('No USDC address configured for this chain yet (SCP_CONFIG.USDC_ADDRESS is empty).');
      const decimals = await new window.ethers.Contract(SCP_CONFIG.USDC_ADDRESS, ERC20_ABI, readProvider()).decimals().catch(()=>6);
      return {address: SCP_CONFIG.USDC_ADDRESS, decimals: Number(decimals)};
    }
    // 'token' -- the campaigning token itself
    const decimals = await new window.ethers.Contract(form.contract, ERC20_ABI, readProvider()).decimals().catch(()=>18);
    return {address: form.contract, decimals: Number(decimals)};
  }

  const submit = async ()=>{
    if(!resolved){ notify('Resolve a valid token contract first.'); return; }
    try {
      const {address: rewardToken, decimals} = await resolveRewardToken();
      const amountWei = window.ethers.parseUnits(String(form.amount||'0'), decimals);
      const signer = await user.getSigner();
      const factoryAddr = isSHO ? SCP_CONFIG.SHO_FACTORY_ADDRESS : SCP_CONFIG.SSO_FACTORY_ADDRESS;

      // Check the wallet can actually cover this before spending a transaction (and its gas)
      // finding out -- a failed createCampaign() reverts with an OZ v5 custom error ethers
      // can't name on its own (see shortError's decodeKnownError), so this is worth catching
      // here with a clear message rather than only after a failed on-chain attempt.
      if(rewardToken === window.ethers.ZeroAddress){
        const ethBalance = await readProvider().getBalance(user.wallet);
        if(ethBalance < amountWei){
          throw new Error(`Insufficient ${SCP_CONFIG.NATIVE_SYMBOL} balance: wallet has ${fmtTokenAmount(ethBalance)}, this campaign needs ${form.amount} ${SCP_CONFIG.NATIVE_SYMBOL} (plus gas).`);
        }
      } else {
        const tokenBalance = await new window.ethers.Contract(rewardToken, ERC20_ABI, readProvider()).balanceOf(user.wallet);
        if(tokenBalance < amountWei){
          throw new Error(`Insufficient ${denomLabel} balance: wallet has ${fmtTokenAmount(tokenBalance)}, this campaign needs ${form.amount} ${denomLabel}.`);
        }
      }

      if(rewardToken !== window.ethers.ZeroAddress){
        const erc20 = new window.ethers.Contract(rewardToken, ERC20_ABI, signer);
        const allowance = await erc20.allowance(user.wallet, factoryAddr);
        if(allowance < amountWei){
          setSubmitting('approving');
          notify('Approving the factory to pull the reward pool...');
          const approveTx = await erc20.approve(factoryAddr, amountWei);
          await approveTx.wait();
        }
      }

      setSubmitting('creating');
      notify('Submitting campaign creation...');
      const value = rewardToken===window.ethers.ZeroAddress ? amountWei : 0n;
      let receipt, factory;
      if(isSHO){
        const chosenTiers = MS_TIERS.filter(t=>form.msOn[t.id]);
        factory = new window.ethers.Contract(factoryAddr, SHO_FACTORY_ABI, signer);
        const tx = await factory.createCampaign(
          form.contract, rewardToken, amountWei, windowEnumOf(form.window), form.size,
          durationSecondsOf(form.duration),
          chosenTiers.map(t=>MS_TIERS.findIndex(x=>x.id===t.id)),
          chosenTiers.map(t=>form.ms[t.id]),
          {value}
        );
        receipt = await tx.wait();
      } else {
        factory = new window.ethers.Contract(factoryAddr, SSO_FACTORY_ABI, signer);
        const epochCount = Math.max(1, Math.round(durationSecondsOf(form.duration)/(windowEnumOf(form.epochLen)===0?86400:windowEnumOf(form.epochLen)===1?604800:2592000)));
        const evenBps = Math.floor(10000/epochCount);
        const epochBpsList = Array.from({length:epochCount}, (_,i)=> i===epochCount-1 ? 10000-evenBps*(epochCount-1) : evenBps);
        const tx = await factory.createCampaign(
          form.contract, rewardToken, amountWei, form.keyword, windowEnumOf(form.epochLen), form.size,
          durationSecondsOf(form.duration), epochBpsList,
          {value}
        );
        receipt = await tx.wait();
      }

      // The new clone's address only exists in the CampaignCreated log, not a plain return
      // value we can read back from a mined tx -- decode it the same way ethers itself
      // recommends for a non-view function's return data.
      let campaignAddress = null;
      for(const log of receipt.logs){
        try {
          const parsed = factory.interface.parseLog(log);
          if(parsed && parsed.name==='CampaignCreated'){ campaignAddress = parsed.args.campaign; break; }
        } catch(e){ /* not this contract's event, ignore */ }
      }

      notify(`${form.token} ${isSHO?'SHO':'SSO'} campaign created, 0.5% fee deducted.`);
      go(campaignAddress ? `/${kind}/${campaignAddress}` : `/${kind}`);
    } catch(e){
      notify('Campaign creation failed: '+shortError(e));
    } finally {
      setSubmitting(null);
    }
  };

  return (
    <div className="page">
      <div className="wrap">
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / <button onClick={()=>go(`/${kind}`)}>{isSHO?'SHO':'SSO'}</button> / New</div>
        <div className="page-head"><h1>New {isSHO?'Strong Hold':'Strong Shill'} Offering</h1></div>

        <div className="wizard">
          <div className="steps">
            {steps.map((s,i)=>(
              <div key={s} className={`step-item ${i<step?'done':''} ${i===step?'current':''}`}>
                <span className="idx">{i<step?<IcoCheckCirc size={11} sw={2.2}/>:i+1}</span>{s}
              </div>
            ))}
          </div>

          <div className="panel">
            {step===0 && (
              <>
                <div className="field">
                  <label>Token to track &mdash; contract address</label>
                  <input type="text" className="mono" value={form.contract} onChange={e=>set('contract',e.target.value)} placeholder="0x..."/>
                  {form.contract.trim()==='' ? null : tokenLookup.loading ? (
                    <div className="token-resolved">Looking up on {SCP_CONFIG.CHAIN_NAME}&hellip;</div>
                  ) : resolved ? (
                    <div className="token-resolved">
                      <IcoCheckCirc size={14}/> Resolved <b>{resolved.name}</b> <span className="mono">{resolved.ticker}</span>
                    </div>
                  ) : (
                    <div className="token-resolved bad">
                      <IcoInfo size={14}/> Not a recognized ERC20 on {SCP_CONFIG.CHAIN_NAME} &mdash; check the address.
                    </div>
                  )}
                  <div className="help">The Pons.family (or graduated Uniswap V4) token whose activity this campaign tracks &mdash; net-buy volume for SHO, or the account posting about it for SSO. Added by contract, never by typing a ticker.</div>
                </div>
                <div className="field">
                  <label>Amount to lock</label>
                  <input type="text" value={form.amount} onChange={e=>set('amount',e.target.value)}/>
                  <div className="help">0.5% protocol fee deducted at creation &middot; net escrowed: {fmtNum(Math.round(Number(form.amount||0)*0.995))} {denomLabel}</div>
                </div>
              </>
            )}

            {step===1 && isSHO && (
              <>
                <div className="field">
                  <label>Reward denomination</label>
                  <div className="opt-row">
                    {[['token', form.token],['usdc','USDC'],['eth', SCP_CONFIG.NATIVE_SYMBOL]].map(([v,l])=>(
                      <button key={v} className={`opt-btn ${form.denom===v?'sel':''}`} disabled={v==='usdc' && !SCP_CONFIG.USDC_ADDRESS} onClick={()=>set('denom',v)}>{l}</button>
                    ))}
                  </div>
                  {!SCP_CONFIG.USDC_ADDRESS && <div className="help">USDC isn&rsquo;t deployed on {SCP_CONFIG.CHAIN_NAME} yet, so that option is disabled here.</div>}
                </div>
                <div className="field">
                  <label>Leaderboard window</label>
                  <div className="opt-row">
                    {['24H','7D','30D'].map(v=>(
                      <button key={v} className={`opt-btn ${form.window===v?'sel':''}`} onClick={()=>set('window',v)}>{v}</button>
                    ))}
                  </div>
                </div>
                <div className="field">
                  <label>Leaderboard size</label>
                  <div className="opt-row">
                    {[50,100,500].map(v=>(
                      <button key={v} className={`opt-btn ${form.size===v?'sel':''}`} onClick={()=>set('size',v)}>Top {v}</button>
                    ))}
                  </div>
                </div>
              </>
            )}

            {step===1 && !isSHO && (
              <>
                <div className="field">
                  <label>Reward denomination</label>
                  <div className="opt-row">
                    {[['token', form.token],['usdc','USDC'],['eth', SCP_CONFIG.NATIVE_SYMBOL]].map(([v,l])=>(
                      <button key={v} className={`opt-btn ${form.denom===v?'sel':''}`} disabled={v==='usdc' && !SCP_CONFIG.USDC_ADDRESS} onClick={()=>set('denom',v)}>{l}</button>
                    ))}
                  </div>
                  {!SCP_CONFIG.USDC_ADDRESS && <div className="help">USDC isn&rsquo;t deployed on {SCP_CONFIG.CHAIN_NAME} yet, so that option is disabled here.</div>}
                </div>
                <div className="field">
                  <label>Tracked keyword</label>
                  <input type="text" value={form.keyword} onChange={e=>set('keyword',e.target.value)}/>
                  <div className="help">A hashtag, cashtag, or phrase. Set once, immutable after creation.</div>
                </div>
              </>
            )}

            {step===2 && isSHO && (
              <div className="field">
                <label>Campaign duration</label>
                <div className="opt-row">
                  {['7D','30D','90D'].map(v=>(
                    <button key={v} className={`opt-btn ${form.duration===v?'sel':''}`} onClick={()=>set('duration',v)}>{v}</button>
                  ))}
                </div>
                <div className="help">Deadline for all milestones to be reached. Whatever's unreached locks forever.</div>
              </div>
            )}

            {step===2 && !isSHO && (
              <>
                <div className="field">
                  <label>Epoch length</label>
                  <div className="opt-row">
                    {['24H','7D','30D'].map(v=>(
                      <button key={v} className={`opt-btn ${form.epochLen===v?'sel':''}`} onClick={()=>set('epochLen',v)}>{v}</button>
                    ))}
                  </div>
                </div>
                <div className="field">
                  <label>Leaderboard size (per epoch)</label>
                  <div className="opt-row">
                    {[50,100,500].map(v=>(
                      <button key={v} className={`opt-btn ${form.size===v?'sel':''}`} onClick={()=>set('size',v)}>Top {v}</button>
                    ))}
                  </div>
                </div>
              </>
            )}

            {step===3 && isSHO && (
              <>
                <div className="field">
                  <label>Milestones &amp; pool split</label>
                  <div className="milestone-picker">
                    {MS_TIERS.map(t=>(
                      <div key={t.id} className={`ms-pick-row ${form.msOn[t.id]?'on':''}`}>
                        <input type="checkbox" checked={form.msOn[t.id]} onChange={e=>set('msOn',{...form.msOn,[t.id]:e.target.checked})}/>
                        <span className="label">{t.label} mcap</span>
                        <input className="bps" type="number" min="0" max="100" value={(form.ms[t.id]||0)/100}
                          onChange={e=>set('ms',{...form.ms,[t.id]: Math.round(Number(e.target.value||0)*100)})}
                          disabled={!form.msOn[t.id]} />
                        <span className="camp-meta">%</span>
                      </div>
                    ))}
                  </div>
                  {bpsOk ? <div className="bps-ok">&#10003; Allocations sum to 100%</div> : <div className="bps-warn">Allocations must sum to exactly 100% (currently {totalBps/100}%)</div>}
                </div>
              </>
            )}

            {step===3 && !isSHO && (
              <div className="field">
                <label>Campaign duration</label>
                <div className="opt-row">
                  {['7D','30D','90D'].map(v=>(
                    <button key={v} className={`opt-btn ${form.duration===v?'sel':''}`} onClick={()=>set('duration',v)}>{v}</button>
                  ))}
                </div>
                <div className="help">With a {form.epochLen} epoch, that's roughly {Math.max(1,Math.round((form.duration==='7D'?7:form.duration==='30D'?30:90)/(form.epochLen==='24H'?1:form.epochLen==='7D'?7:30)))} epochs, pool split evenly by default.</div>
              </div>
            )}

            {step===4 && (
              <div>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoCheckCirc size={13}/>Review &amp; confirm</div>
                <div className="kv"><span className="k">Token</span><span className="v">{resolved ? resolved.name : '—'} ({form.token})</span></div>
                <div className="kv"><span className="k">Contract</span><span className="v mono" style={{fontSize:11}}>{shortAddr(form.contract)}</span></div>
                <div className="kv"><span className="k">Locked amount</span><span className="v">{fmtNum(Number(form.amount||0))} {denomLabel}</span></div>
                <div className="kv"><span className="k">Protocol fee (0.5%)</span><span className="v">&minus;{fmtNum(Math.round(Number(form.amount||0)*0.005))} {denomLabel}</span></div>
                <div className="kv"><span className="k">Net escrowed</span><span className="v">{fmtNum(Math.round(Number(form.amount||0)*0.995))} {denomLabel}</span></div>
                <div className="kv"><span className="k">Reward denomination</span><span className="v">{denomLabel}</span></div>
                {isSHO ? (
                  <>
                    <div className="kv"><span className="k">Leaderboard</span><span className="v">Top {form.size} &middot; {form.window} window</span></div>
                    <div className="kv"><span className="k">Duration</span><span className="v">{form.duration}</span></div>
                    <div className="kv"><span className="k">Milestones</span><span className="v">{MS_TIERS.filter(t=>form.msOn[t.id]).map(t=>t.label).join(', ')}</span></div>
                  </>
                ) : (
                  <>
                    <div className="kv"><span className="k">Keyword</span><span className="v">{form.keyword}</span></div>
                    <div className="kv"><span className="k">Epoch</span><span className="v">{form.epochLen} &middot; Top {form.size}</span></div>
                    <div className="kv"><span className="k">Duration</span><span className="v">{form.duration}</span></div>
                  </>
                )}
                <div className="help" style={{marginTop:16}}>Campaigns are immutable once created &middot; unreached milestones lock permanently, with no way to reclaim them.</div>
              </div>
            )}

            <div className="wizard-actions">
              <Btn kind="ghost" onClick={back} disabled={step===0 || !!submitting}>Back</Btn>
              {step<steps.length-1
                ? <Btn onClick={next} disabled={(step===0 && !resolved) || (isSHO && step===3 && !bpsOk)}>Continue</Btn>
                : <Btn onClick={submit} disabled={!!submitting}>{submitting==='approving' ? 'Approving…' : submitting==='creating' ? 'Creating…' : 'Create campaign'}</Btn>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

          </div>
          <div className="field">

            {!user.wallet && <div className="help">Connect a wallet first.</div>}

/* ===================== LINK X CALLBACK ===================== */
// Where ../registration-service's /auth/x/callback redirects back to (when it has
// FRONTEND_URL configured -- see its server.js) after a completed OAuth round-trip. Finishes
// the on-chain half of PRD §12.3-12.4 that service never does itself: submitting
// Registry.registerHandle(xHandle, attestation) using the connected wallet.
function LinkXCallback({go, user, notify}){
  const params = useMemo(()=> parseQuery((window.location.hash.split('?')[1])||''), []);
  const {wallet: startedWallet, handle, attestation, error: oauthError} = params;
  const [submitting, setSubmitting] = useState(false);

  const confirm = async ()=>{
    setSubmitting(true);
    try {
      const signer = await user.getSigner();
      const registry = new window.ethers.Contract(SCP_CONFIG.REGISTRY_ADDRESS, REGISTRY_ABI, signer);
      const tx = await registry.registerHandle(handle, attestation);
      notify('Linking submitted -- waiting for confirmation...');
      await tx.wait();
      await user.refreshXHandle();
      notify(`${handle} linked on-chain.`);
      go('/profile');
    } catch(e){
      notify('Linking failed: '+shortError(e));
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="page">
      <div className="wrap" style={{maxWidth:520}}>
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / Register</div>
        <h1 style={{marginBottom:8}}>Confirm your X link</h1>
        <div className="panel">
          {oauthError ? (
            <div className="you-empty">X sign-in didn&rsquo;t complete: {oauthError}. <button style={{background:'none',border:'none',color:'var(--accent)',textDecoration:'underline',cursor:'pointer',font:'inherit',padding:0}} onClick={()=>go('/register')}>Try again</button></div>
          ) : !handle || !attestation ? (
            <div className="you-empty">Nothing to confirm here &mdash; this page only makes sense right after returning from X sign-in. <button style={{background:'none',border:'none',color:'var(--accent)',textDecoration:'underline',cursor:'pointer',font:'inherit',padding:0}} onClick={()=>go('/register')}>Start registration</button></div>
          ) : !user.wallet ? (
            <div className="you-empty">
              Reconnect the wallet you started with ({shortAddr(startedWallet)}) to finish linking.
              <div style={{marginTop:12}}><Btn size="sm" icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn></div>
            </div>
          ) : startedWallet && user.wallet.toLowerCase()!==startedWallet.toLowerCase() ? (
            <div className="you-empty">This link was started from {shortAddr(startedWallet)}, but {shortAddr(user.wallet)} is connected now. Switch wallets and reload to continue.</div>
          ) : (
            <>
              <div className="kv"><span className="k">Wallet</span><span className="v">{shortAddr(user.wallet)}</span></div>
              <div className="kv"><span className="k">X handle</span><span className="v">{handle}</span></div>
              <p className="camp-meta" style={{margin:'12px 0 16px'}}>X verified this handle for your wallet. One more signature submits Registry.registerHandle(...) on-chain to finish linking.</p>
              <Btn block icon={IcoShield} disabled={submitting} onClick={confirm}>{submitting?'Confirming…':'Confirm on-chain'}</Btn>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===================== PROFILE ===================== */

function Profile({go, user, notify}){
  const hasWallet = !!user.wallet;
  const hasX = !!user.xhandle;
  const connected = hasWallet || hasX;
  const [refreshTick, setRefreshTick] = useState(0);

  // Cross-referenced against the full campaign lists (same "look it up by address" pattern
  // the old mock used with SHO_CAMPAIGNS.find/SSO_CAMPAIGNS.find) since the wallet-scoped
  // endpoints below intentionally return only addresses + numbers, not display fields --
  // see walletRoutes.js's own header.
  const shoCampaigns = useApiFetch(hasWallet ? '/sho/campaigns' : null, [hasWallet]);
  const ssoCampaigns = useApiFetch(hasWallet ? '/sso/campaigns' : null, [hasWallet]);
  const standings = useApiFetch(hasWallet ? `/wallets/${user.wallet}/standings` : null, [hasWallet, user.wallet, refreshTick]);
  const claims = useApiFetch(hasWallet ? `/wallets/${user.wallet}/claims` : null, [hasWallet, user.wallet, refreshTick]);
  const created = useApiFetch(hasWallet ? `/wallets/${user.wallet}/created` : null, [hasWallet, user.wallet, refreshTick]);
  const [claiming, setClaiming] = useState(null);

  // Normalized (not the raw api/ shape) so these match what CampaignCard/detail pages already
  // expect -- window/epochLen/denom etc. only exist post-normalization (see
  // normalizeShoCampaign/normalizeSsoCampaign), the raw response uses windowSeconds/
  // epochSeconds/rewardTokenSymbol instead.
  const findSho = (addr)=> {
    const raw = shoCampaigns.data && shoCampaigns.data.campaigns.find(c=>c.contract.toLowerCase()===addr.toLowerCase());
    return raw ? normalizeShoCampaign(raw) : null;
  };
  const findSso = (addr)=> {
    const raw = ssoCampaigns.data && ssoCampaigns.data.campaigns.find(c=>c.contract.toLowerCase()===addr.toLowerCase());
    return raw ? normalizeSsoCampaign(raw) : null;
  };

  const shoPositions = (standings.data ? standings.data.sho : []).map(s=>({...s, c:findSho(s.campaignAddress)})).filter(p=>p.c);
  const ssoPositions = (standings.data ? standings.data.sso : []).map(s=>({...s, c:findSso(s.campaignAddress)})).filter(p=>p.c);
  const createdSho = (created.data ? created.data.created : []).filter(c=>c.factory==='sho').map(c=>({...c, full:findSho(c.id)}));
  const createdSso = (created.data ? created.data.created : []).filter(c=>c.factory==='sso').map(c=>({...c, full:findSso(c.id)}));
  const allClaims = claims.data ? claims.data.claims : [];
  const history = allClaims.filter(cl=>cl.status==='claimed');
  const claimableEntries = allClaims.filter(cl=>cl.status==='claimable').map(cl=>{
    const full = cl.factory==='sho' ? findSho(cl.campaignAddress) : findSso(cl.campaignAddress);
    return {...cl, full};
  });

  const doClaimFromProfile = async (cl)=>{
    setClaiming(cl.campaignAddress+':'+cl.index);
    try {
      const res = await fetch(`${SCP_CONFIG.API_BASE_URL}/campaigns/${cl.campaignAddress}/claim-proof?wallet=${user.wallet}&index=${cl.index}`);
      const body = await res.json();
      if(!res.ok) throw new Error(body.error || 'failed to fetch claim proof');
      const signer = await user.getSigner();
      const campaign = new window.ethers.Contract(cl.campaignAddress, CAMPAIGN_ABI, signer);
      const tx = await campaign.claim(cl.index, body.amount, body.proof);
      notify('Claim submitted -- waiting for confirmation...');
      await tx.wait();
      notify('Claim confirmed.');
      setRefreshTick(t=>t+1);
    } catch(e){
      notify('Claim failed: '+shortError(e));
    } finally {
      setClaiming(null);
    }
  };

  const totalClaimableAmount = claimableEntries.reduce((s,it)=>s+fmtTokenAmount(it.amount),0);
  const activeCount = shoPositions.length + ssoPositions.length;
  const createdCount = createdSho.length + createdSso.length;

  const roles = [];
  if(shoPositions.length) roles.push({label:'Trader', kind:'sho'});
  if(ssoPositions.length) roles.push({label:'Shiller', kind:'sso'});
  if(createdCount) roles.push({label:'Creator', kind:'neutral'});

  return (
    <div className="page">
      <div className="wrap" style={{maxWidth:980}}>
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / Profile</div>

        <div className="profile-head">
          <div className="profile-avatar"><IcoWallet size={22}/></div>
          <div style={{flex:1,minWidth:220}}>
            <h1 style={{fontSize:26,marginBottom:6}}>{hasWallet ? shortAddr(user.wallet) : hasX ? user.xhandle : 'Your profile'}</h1>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
              {hasWallet && hasX && <span className="camp-meta">{user.xhandle}</span>}
              {roles.map(r=> <Tag key={r.label} kind={r.kind}>{r.label}</Tag>)}
            </div>
          </div>
          {!hasWallet && <Btn size="sm" icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn>}
          {!hasX && <Btn kind="outline" size="sm" icon={IcoX} onClick={()=>go('/register')}>Register X</Btn>}
          {connected && <Btn kind="ghost" size="sm" icon={IcoLogout} onClick={()=>{user.disconnect(); notify('Logged out.'); go('/');}}>Log out</Btn>}
        </div>

        {!connected ? (
          <div className="empty-state">
            <h3>Connect to see your dashboard</h3>
            <p>Connect a wallet to track your SHO trading positions, or register your X account to track shilling. Claimable rewards, positions, and history will show up here.</p>
            <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:16,flexWrap:'wrap'}}>
              <Btn icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn>
              <Btn kind="outline" icon={IcoX} onClick={()=>go('/register')}>Register X</Btn>
            </div>
          </div>
        ) : (
          <>
            <div className="profile-stats">
              <div className="stat-tile"><IcoCoins size={20}/><div><StatNum value={history.length} format={v=>Math.round(v)}/><span className="lbl">Rewards claimed</span></div></div>
              <div className="stat-tile accent"><IcoCheckCirc size={20}/><div><StatNum value={claimableEntries.length} format={v=>Math.round(v)}/><span className="lbl">Claimable now</span></div></div>
              <div className="stat-tile"><IcoTarget size={20}/><div><StatNum value={activeCount} format={v=>Math.round(v)}/><span className="lbl">Active positions</span></div></div>
              <div className="stat-tile"><IcoFlask size={20}/><div><StatNum value={createdCount} format={v=>Math.round(v)}/><span className="lbl">Campaigns created</span></div></div>
            </div>

            {claimableEntries.length>0 && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoCheckCirc size={13}/>Claimable now</div>
                <div className="claim-list">
                  {claimableEntries.map((it,i)=>(
                    <div key={i} className="claim-row" onClick={()=>go(`/${it.factory}/${it.campaignAddress}`)}>
                      <div>
                        <div style={{fontWeight:600,fontSize:13.5,display:'flex',alignItems:'center',gap:8}}>{it.full ? it.full.token : shortAddr(it.campaignAddress)} <Tag kind={it.factory}>{it.factory==='sho'?'SHO':'SSO'}</Tag></div>
                        <div className="camp-meta">{it.factory==='sho' ? `Milestone ${it.index}` : `Epoch ${it.index+1}`} reward</div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:14}}>
                        <div style={{textAlign:'right'}}>
                          <div className="mono" style={{fontWeight:600}}>{fmtNum(fmtTokenAmount(it.amount))} {it.full ? it.full.denom : ''}</div>
                        </div>
                        <Btn size="sm" icon={IcoCheckCirc} disabled={claiming===it.campaignAddress+':'+it.index} onClick={(e)=>{e.stopPropagation(); doClaimFromProfile(it);}}>{claiming===it.campaignAddress+':'+it.index ? 'Claiming…' : 'Claim'}</Btn>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {shoPositions.length>0 && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoTrendUp size={13}/>My SHO positions</div>
                <div className="scroll-x">
                  <table className="lb-table">
                    <thead><tr><th>Campaign</th><th>Rank</th><th>Net-buy volume</th><th>Status</th></tr></thead>
                    <tbody>
                      {shoPositions.map(p=>(
                        <tr key={p.campaignAddress} style={{cursor:'pointer'}} onClick={()=>go(`/sho/${p.campaignAddress}`)}>
                          <td>{p.c.token}</td>
                          <td className="rank">#{p.rank}</td>
                          <td className="mono">{fmtUSD(fmtTokenAmount(p.score))}</td>
                          <td><Tag kind="neutral" icon={IcoClock}>Tracking</Tag></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {ssoPositions.length>0 && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoMegaphone size={13}/>My SSO positions</div>
                <div className="scroll-x">
                  <table className="lb-table">
                    <thead><tr><th>Campaign</th><th>Rank</th><th>Engagement score</th><th>Status</th></tr></thead>
                    <tbody>
                      {ssoPositions.map(p=>(
                        <tr key={p.campaignAddress+':'+p.epochIndex} style={{cursor:'pointer'}} onClick={()=>go(`/sso/${p.campaignAddress}`)}>
                          <td>{p.c.token}</td>
                          <td className="rank">#{p.rank}</td>
                          <td className="mono">{fmtNum(p.score)}</td>
                          <td><Tag kind="neutral" icon={IcoClock}>Tracking</Tag></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {(createdSho.length>0 || createdSso.length>0) && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:14,display:'flex',alignItems:'center',gap:6}}><IcoFlask size={13}/>My created campaigns</div>
                <div className="created-grid">
                  {createdSho.map(c=>{
                    const f = c.full;
                    const distributedBps = f ? f.milestones.filter(m=>m.status==='claimed'||m.status==='claimable').reduce((s,m)=>s+m.bps,0) : 0;
                    const locked = fmtTokenAmount(f ? f.locked : c.locked);
                    return (
                      <div key={c.id} className="created-card" onClick={()=>go(`/sho/${c.id}`)}>
                        <div className="camp-card-top">
                          <div><div className="ticker">{f ? f.token : shortAddr(c.token)}</div><div className="camp-meta">SHO{f?` · ${f.window} window`:''}</div></div>
                          <Tag kind="sho">{f && f.milestones.every(m=>m.status==='claimed'||m.status==='claimable') ? 'Completed' : 'Active'}</Tag>
                        </div>
                        <div className="kv"><span className="k">Locked</span><span className="v">{fmtNum(locked)} {f ? f.denom : ''}</span></div>
                        <div className="kv"><span className="k">Distributed</span><span className="v">{distributedBps/100}%</span></div>
                        <div className="kv"><span className="k">Remaining</span><span className="v">{fmtNum(locked*(10000-distributedBps)/10000)} {f ? f.denom : ''}</span></div>
                      </div>
                    );
                  })}
                  {createdSso.map(c=>{
                    const f = c.full;
                    const distributedEpochs = f ? f.epochs.filter(e=>e.status==='claimed'||e.status==='claimable').length : 0;
                    const distributedBps = f ? Math.round(10000*distributedEpochs/f.epochs.length) : 0;
                    const locked = fmtTokenAmount(f ? f.locked : c.locked);
                    return (
                      <div key={c.id} className="created-card" onClick={()=>go(`/sso/${c.id}`)}>
                        <div className="camp-card-top">
                          <div><div className="ticker">{f ? f.token : shortAddr(c.token)}</div><div className="camp-meta">SSO{f?` · ${f.epochLen} epochs`:''}</div></div>
                          <Tag kind="sso">{f && f.currentEpochIndex==null ? 'Completed' : 'Active'}</Tag>
                        </div>
                        <div className="kv"><span className="k">Locked</span><span className="v">{fmtNum(locked)} {f ? f.denom : ''}</span></div>
                        <div className="kv"><span className="k">Distributed</span><span className="v">{distributedBps/100}%</span></div>
                        <div className="kv"><span className="k">Remaining</span><span className="v">{fmtNum(locked*(10000-distributedBps)/10000)} {f ? f.denom : ''}</span></div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {history.length>0 && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoTrophy size={13}/>Claim history</div>
                <div className="scroll-x">
                  <table className="lb-table">
                    <thead><tr><th>Date</th><th>Campaign</th><th>Reward</th><th>Amount</th></tr></thead>
                    <tbody>
                      {history.map((h,i)=>{
                        const f = h.factory==='sho' ? findSho(h.campaignAddress) : findSso(h.campaignAddress);
                        return (
                          <tr key={i}>
                            <td className="mono" style={{fontSize:12}}>{h.claimedAt ? new Date(h.claimedAt).toLocaleDateString() : '—'}</td>
                            <td><span style={{display:'inline-flex',alignItems:'center',gap:8}}>{f ? f.token : shortAddr(h.campaignAddress)} <Tag kind={h.factory}>{h.factory==='sho'?'SHO':'SSO'}</Tag></span></td>
                            <td className="camp-meta">{h.factory==='sho' ? `Milestone ${h.index}` : `Epoch ${h.index+1}`}</td>
                            <td className="mono">{fmtNum(fmtTokenAmount(h.amount))} {f ? f.denom : ''} {h.txHash && <a href={explorerTxUrl(h.txHash)} target="_blank" rel="noopener noreferrer" className="camp-meta">(tx)</a>}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ===================== APP SHELL ===================== */

function TopNav({route, go, theme, setTheme, user}){
  const is = (p)=> route===p || route.startsWith(p+'/');
  return (
    <div className="topnav">
      <div className="topnav-inner">
        <button className="brand" onClick={()=>go('/')}>
          <span className="brand-mark"><IcoLock size={14} sw={2}/></span>
          <span className="brand-word">Strong Commitment Protocol</span>
        </button>
        <div className="nav-links">
          <button className={`nav-link ${is('/sho')?'active':''}`} onClick={()=>go('/sho')}><IcoTrendUp size={13}/>SHO</button>
          <button className={`nav-link ${is('/sso')?'active':''}`} onClick={()=>go('/sso')}><IcoMegaphone size={13}/>SSO</button>
        </div>
        <div className="nav-right">
          <button className="theme-toggle" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} title="Toggle theme" aria-label="Toggle theme">
            {theme==='dark' ? '☀' : '☽'}
          </button>
          {user.xhandle
            ? <button className={`nav-chip ${is('/profile')?'active':''}`} onClick={()=>go('/profile')}><IcoCheckCirc size={12}/>{user.xhandle}</button>
            : <Btn kind="outline" size="sm" icon={IcoX} onClick={()=>go('/register')}>Register X</Btn>}
          {user.wallet
            ? <button className={`nav-chip mono ${is('/profile')?'active':''}`} onClick={()=>go('/profile')}><IcoWallet size={12}/>{shortAddr(user.wallet)}</button>
            : <Btn size="sm" icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn>}
          {user.wallet && !user.chainOk && <Btn kind="outline" size="sm" onClick={user.connectWallet}>Switch to {SCP_CONFIG.CHAIN_NAME}</Btn>}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [route,go] = useHashRoute();
  const user = useWallet();
  const [theme,setTheme] = useState(()=> localStorage.getItem('so_theme') || 'dark');
  const [toast,setToast] = useState(null);
  const notify = (m)=> setToast(m);

  useEffect(()=>{
    const root = document.documentElement;
    if(theme==='auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', theme);
    if(theme!=='auto') localStorage.setItem('so_theme', theme); else localStorage.removeItem('so_theme');
  },[theme]);

  let view;
  const path = route.split('?')[0];
  const parts = path.split('/').filter(Boolean);
  if(route==='/' ) view = <Landing go={go}/>;
  else if(parts[0]==='sho' && parts[1]==='create') view = <CreateWizard kind="sho" go={go} user={user} notify={notify}/>;
  else if(parts[0]==='sso' && parts[1]==='create') view = <CreateWizard kind="sso" go={go} user={user} notify={notify}/>;
  else if(parts[0]==='sho' && parts[1]) view = <SHODetail id={parts[1]} go={go} user={user} notify={notify}/>;
  else if(parts[0]==='sso' && parts[1]) view = <SSODetail id={parts[1]} go={go} user={user} notify={notify}/>;
  else if(parts[0]==='sho') view = <Discover kind="sho" go={go}/>;
  else if(parts[0]==='sso') view = <Discover kind="sso" go={go}/>;
  else if(parts[0]==='register') view = <Register go={go} user={user} notify={notify}/>;
  else if(parts[0]==='link-x') view = <LinkXCallback go={go} user={user} notify={notify}/>;
  else if(parts[0]==='profile') view = <Profile go={go} user={user} notify={notify}/>;
  else view = <Landing go={go}/>;

  return (
    <>
      <TopNav route={route} go={go} theme={theme==='auto'?'dark':theme} setTheme={setTheme} user={user}/>
      {view}
      {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
