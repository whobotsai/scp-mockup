<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Set the theme attribute before first paint so there is no flash of the wrong
// theme while React mounts (dark is the default; this mirrors the logic in App()).
(function(){
  try{
    var t = localStorage.getItem('so_theme') || 'dark';
    if(t !== 'auto') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<title>Strong Commitment Protocol</title>
<style>
/* ============ FONTS ============ */
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ============ TOKENS ============ */
/* Brand field: Robinhood chartreuse (#D7FA4A family) is the dominant color, not just an accent.
   Light theme: the chartreuse IS the page field; white cards float on it; CTAs invert to ink-on-chartreuse.
   Dark theme: the field goes dark for legibility, but the same chartreuse stays the loud, unmistakable accent. */
:root{
  --bg:#D8FA4E;
  --surface:#FFFFFF;
  --surface-2:#F1F8DC;
  --border:#B7D65E;
  --text:#12160B;
  --text-dim:#48551F;
  --text-faint:#6E7C42;
  --accent:#6B9400;
  --accent-strong:#547600;
  --accent-soft:#EAF7BE;
  --accent-ink:#FFFFFF;
  --cta-bg:#12160B;
  --cta-ink:#E8FA9E;
  --sho:#A5741F;
  --sho-soft:#F1E3C8;
  --sso:#3E5C9A;
  --sso-soft:#DFE5F3;
  --danger:#A8452F;
  --danger-soft:#F3E0D9;
  --shadow: 0 1px 2px rgba(18,22,11,.08), 0 10px 26px -14px rgba(18,22,11,.28);
  --radius-s:4px;
  --radius-m:8px;
  --radius-l:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111409;
    --surface:#181D12;
    --surface-2:#1F2517;
    --border:#333D22;
    --text:#F1F6DE;
    --text-dim:#A3B383;
    --text-faint:#71805A;
    --accent:#C6F23E;
    --accent-strong:#DBFC6E;
    --accent-soft:#232C13;
    --accent-ink:#0C1005;
    --cta-bg:#C6F23E;
    --cta-ink:#0C1005;
    --sho:#DDB05C;
    --sho-soft:#332A17;
    --sso:#8CA6E0;
    --sso-soft:#1E273B;
    --danger:#E28568;
    --danger-soft:#3A241D;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 34px -16px rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111409;
  --surface:#181D12;
  --surface-2:#1F2517;
  --border:#333D22;
  --text:#F1F6DE;
  --text-dim:#A3B383;
  --text-faint:#71805A;
  --accent:#C6F23E;
  --accent-strong:#DBFC6E;
  --accent-soft:#232C13;
  --accent-ink:#0C1005;
  --cta-bg:#C6F23E;
  --cta-ink:#0C1005;
  --sho:#DDB05C;
  --sho-soft:#332A17;
  --sso:#8CA6E0;
  --sso-soft:#1E273B;
  --danger:#E28568;
  --danger-soft:#3A241D;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 34px -16px rgba(0,0,0,.65);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--text);
  font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,h4{
  font-family:'Big Shoulders','Arial Narrow',sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.01em;
  text-wrap:balance;
  margin:0;
  color:var(--text);
}
.mono, .num, code{
  font-family:'IBM Plex Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}

.wrap{max-width:1120px;margin:0 auto;padding:0 44px;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-dim);
}

/* ============ NAV ============ */
.topnav{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topnav-inner{
  max-width:1120px;margin:0 auto;padding:14px 44px;
  display:flex;align-items:center;gap:28px;
}
@media (max-width: 880px){ .topnav-inner{padding:14px 22px;} }
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;}
.brand-mark{
  width:26px;height:26px;border-radius:6px;
  background:var(--cta-bg);
  display:flex;align-items:center;justify-content:center;
  color:var(--cta-ink);font-family:'Big Shoulders';font-weight:800;font-size:15px;
  flex:none;
}
.brand-word{font-family:'Big Shoulders';font-weight:700;font-size:16.5px;letter-spacing:.005em;text-transform:uppercase;color:var(--text);white-space:nowrap;}
.nav-links{display:flex;gap:4px;flex:1;}
.nav-link{
  background:none;border:none;cursor:pointer;
  font-family:'IBM Plex Sans';font-size:13.5px;font-weight:500;
  color:var(--text-dim);padding:7px 12px;border-radius:6px;
  display:inline-flex;align-items:center;gap:6px;
}
.nav-link:hover{color:var(--text);background:var(--surface-2);}
.nav-link.active{color:var(--text);background:var(--surface-2);}
.nav-right{display:flex;align-items:center;gap:10px;}
.theme-toggle{
  background:none;border:1px solid var(--border);border-radius:7px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);cursor:pointer;
}
.theme-toggle:hover{color:var(--text);border-color:var(--text-faint);}
.nav-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent-soft);color:var(--accent);
  border:1px solid transparent;border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;
  font-family:inherit;cursor:pointer;transition:border-color .12s ease;
}
.nav-chip:hover{border-color:var(--accent);}
.nav-chip.active{border-color:var(--accent);}

/* ============ BUTTONS ============ */
.btn{
  font-family:'IBM Plex Sans';font-weight:600;font-size:13.5px;
  border-radius:7px;padding:9px 16px;border:1px solid transparent;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:filter .12s ease, background .12s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--cta-bg);color:var(--cta-ink);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--text);border-color:transparent;}
.btn-ghost:hover{background:rgba(0,0,0,.06);}
:root[data-theme="dark"] .btn-ghost:hover{background:rgba(255,255,255,.08);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-ghost:hover{background:rgba(255,255,255,.08);}}
.btn-outline{background:transparent;color:var(--cta-bg);border-color:var(--cta-bg);}
.btn-outline:hover{background:var(--surface);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{filter:none;}

/* ============ BADGES / TAGS ============ */
.tag{
  font-family:'IBM Plex Mono';font-size:11px;font-weight:500;letter-spacing:.03em;
  padding:3px 8px;border-radius:5px;display:inline-flex;align-items:center;gap:5px;text-transform:uppercase;
}
.tag-sho{background:var(--sho-soft);color:var(--sho);}
.tag-sso{background:var(--sso-soft);color:var(--sso);}
.tag-danger{background:var(--danger-soft);color:var(--danger);}
.tag-neutral{background:var(--surface-2);color:var(--text-dim);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}

/* ============ CARDS / SURFACES ============ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:22px;}

/* ============ LANDING ============ */
.hero{padding:72px 0 56px;position:relative;overflow:hidden;}
.hero-grid{position:relative;z-index:1;}
.hero > .stat-groups, .hero > .stats-note{position:relative;z-index:1;}

/* Settlement rail: the hero's signature visual. A single schematic ledger line
   showing the mechanism itself (lock -> milestone -> payout), not decoration. */
.rail-wrap{position:absolute;left:-2%;right:-2%;bottom:0;width:104%;aspect-ratio:1000/170;z-index:0;pointer-events:none;}
.rail-svg{width:100%;height:100%;display:block;overflow:visible;}
.rail-path{fill:none;stroke:color-mix(in srgb, var(--text) 16%, transparent);stroke-width:1.5;stroke-dasharray:2 7;stroke-linecap:round;}
.rail-node-ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:railPulse 3.2s ease-out infinite;}
.rail-node-dot{fill:var(--accent);}
.rail-pulse{fill:var(--accent);filter:drop-shadow(0 0 5px var(--accent));}
.rail-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;fill:var(--text-dim);text-transform:uppercase;}

@keyframes railPulse{0%{transform:scale(.7);opacity:.65;}100%{transform:scale(2.1);opacity:0;}}

@media (prefers-reduced-motion: reduce){
  .rail-node-ring{animation:none;opacity:.35;}
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
.hero h1{font-size:56px;line-height:.98;margin:14px 0 18px;}
.hero .lede{font-size:17px;color:var(--text-dim);max-width:46ch;margin-bottom:28px;}
.hero-ctas{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
.hero-ctas::-webkit-scrollbar{display:none;}
.hero-ctas .btn{flex:none;}

.vault{
  aspect-ratio:1/1;border-radius:50%;
  border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:var(--shadow);
}
.vault svg{width:100%;height:100%;position:relative;z-index:1;}
.vault-sweep{
  position:absolute;inset:6%;border-radius:50%;z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0%, var(--accent) 6%, transparent 22%);
  -webkit-mask:radial-gradient(circle, transparent 62%, #000 63%, #000 74%, transparent 75%);
  mask:radial-gradient(circle, transparent 62%, #000 63%, #000 74%, transparent 75%);
  animation:vaultSpin 5s linear infinite;
  opacity:.6;
}
@keyframes vaultSpin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){ .vault-sweep{animation:none;} }
.vault-center{position:absolute;z-index:2;text-align:center;max-width:60%;}
.vault-center .num{font-family:'Big Shoulders';font-size:34px;font-weight:800;color:var(--text);display:block;line-height:1;}
.vault-center .lbl{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.04em;color:var(--text-dim);text-transform:uppercase;display:block;margin-top:6px;line-height:1.4;}

.stat-groups{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:52px;}
.stat-group{border:1px solid var(--border);border-radius:var(--radius-l);background:var(--surface);overflow:hidden;}
.stat-group-head{display:flex;align-items:center;gap:7px;padding:12px 20px;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono';font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
.stat-group-head.sho{color:var(--sho);background:var(--sho-soft);}
.stat-group-head.sso{color:var(--sso);background:var(--sso-soft);}
.stat-group-body{display:grid;grid-template-columns:repeat(3,1fr);}
.stat-group-body .stat-tile{border-right:1px solid var(--border);}
.stat-group-body .stat-tile:last-child{border-right:none;}
.stat-tile{background:var(--surface);padding:18px 18px;display:grid;grid-template-columns:auto 1fr;column-gap:9px;row-gap:2px;align-items:start;}
.stat-tile svg{grid-row:1 / span 2;margin-top:3px;}
.stat-tile .num{font-family:'Big Shoulders';font-size:26px;font-weight:800;display:block;color:var(--text);}
.stat-tile .lbl{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.stats-note{font-size:11.5px;color:var(--text-faint);margin-top:10px;}
.live-dot{
  margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;
  animation:liveDotPulse 2s ease-out infinite;
}
@keyframes liveDotPulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);}
  100%{box-shadow:0 0 0 7px transparent;}
}
@media (prefers-reduced-motion: reduce){ .live-dot{animation:none;} }

/* ============ PROFILE ============ */
.profile-head{display:flex;align-items:center;gap:16px;margin:8px 0 26px;flex-wrap:wrap;}
.profile-avatar{
  width:52px;height:52px;border-radius:14px;flex:none;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.profile-stats .stat-tile{border:1px solid var(--border);border-radius:var(--radius-l);}
.profile-stats .stat-tile.accent{border-color:var(--accent);background:var(--accent-soft);}
.profile-stats .stat-tile.accent svg{color:var(--accent);}
.profile-stats .stat-tile.accent .num{color:var(--accent);}

.claim-list{display:flex;flex-direction:column;}
.claim-row{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 6px;border-bottom:1px solid var(--border);cursor:pointer;
}
.claim-row:last-child{border-bottom:none;}
.claim-row:hover{background:var(--surface-2);}

.created-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.created-card{
  border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;cursor:pointer;
  transition:border-color .12s ease;
}
.created-card:hover{border-color:var(--text-faint);}

.section{padding:64px 0;border-top:1px solid var(--border);}
.section-head{max-width:64ch;margin-bottom:36px;}
.section-head h2{font-size:32px;margin:8px 0 10px;}
.section-head p{color:var(--text-dim);font-size:15.5px;}
.hl{color:var(--accent);font-weight:700;}

.how-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
.how-col{padding:24px;border-radius:var(--radius-l);border:1px solid var(--border);background:var(--surface);}
.how-col-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.how-step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--border);}
.how-step:first-of-type{border-top:none;}
.how-step .n{font-family:'Big Shoulders';font-size:22px;font-weight:800;color:var(--text-faint);flex:none;width:28px;}
.how-step .t{font-weight:600;font-size:14px;margin-bottom:3px;}
.how-step .d{font-size:13.5px;color:var(--text-dim);}

.value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.value-card{padding:24px;border-radius:var(--radius-l);border:1px solid var(--border);background:var(--surface);}
.value-card .k{font-family:'IBM Plex Mono';font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:block;}
.value-card h3{font-size:20px;text-transform:none;margin-bottom:8px;}
.value-card p{font-size:13.5px;color:var(--text-dim);margin:0;}

.cta-band{
  border-radius:var(--radius-l);background:var(--cta-bg);
  padding:40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.cta-band h2{font-size:26px;color:var(--cta-ink);}
.cta-band p{color:var(--cta-ink);opacity:.72;margin:6px 0 0;font-size:14px;}
.cta-band .btn-primary{background:var(--accent);color:var(--accent-ink);}

.footer{border-top:1px solid var(--border);padding:28px 0;color:var(--text-faint);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

/* ============ APP SHELL ============ */
.page{flex:1;padding:36px 0 72px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
.page-head h1{font-size:34px;}
.breadcrumb{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-faint);margin-bottom:8px;}
.breadcrumb button{background:none;border:none;color:var(--text-dim);font-family:inherit;font-size:inherit;cursor:pointer;padding:0;}
.breadcrumb button:hover{color:var(--text);text-decoration:underline;}

.filter-row{display:flex;gap:8px;margin-bottom:22px;}
.pill-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:6px 14px;font-size:12.5px;font-weight:500;color:var(--text-dim);cursor:pointer;
}
.pill-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}

.pagination{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
  margin-top:28px;padding-top:20px;border-top:1px solid var(--border);
}
.pagination-count{font-size:12px;color:var(--text-dim);}
.pagination-nav{display:flex;align-items:center;gap:14px;}
.page-indicator{font-size:12px;color:var(--text-dim);}
.page-btn{
  display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);
  border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;
  transition:border-color .12s ease, color .12s ease;
}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.page-btn:disabled{color:var(--text-faint);cursor:not-allowed;opacity:.5;}
.camp-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  padding:20px;cursor:pointer;transition:border-color .12s ease, transform .12s ease;
  display:flex;flex-direction:column;gap:14px;
}
.camp-card:hover{border-color:var(--text-faint);transform:translateY(-2px);}
.camp-card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.ticker{font-family:'Big Shoulders';font-size:24px;font-weight:800;}
.camp-meta{font-size:12px;color:var(--text-dim);}
.camp-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);}
.camp-row b{color:var(--text);font-weight:600;}

.meter-track{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative;}
.meter-fill{height:100%;background:var(--accent);border-radius:5px;}
.meter-ticks{display:flex;justify-content:space-between;margin-top:6px;}
.meter-tick{font-family:'IBM Plex Mono';font-size:10px;color:var(--text-faint);}
.meter-tick.done{color:var(--sho);}

.detail-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:stretch;}
.milestone-list{display:flex;flex-direction:column;gap:10px;}
.milestone-row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-m);
  border:1px solid var(--border);background:var(--surface);
}
.milestone-row.reached{background:var(--accent-soft);border-color:var(--accent);}
.milestone-row.claimable{background:var(--accent-soft);border-color:var(--accent);}
.ms-icon{
  width:30px;height:30px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--border);font-family:'IBM Plex Mono';font-size:12px;color:var(--text-faint);
}
.milestone-row.reached .ms-icon, .milestone-row.claimable .ms-icon{border-color:var(--accent);color:var(--accent);}
.ms-body{flex:1;}
.ms-title{font-weight:600;font-size:14px;}
.ms-sub{font-size:12px;color:var(--text-dim);margin-top:1px;}

table{width:100%;border-collapse:collapse;}
.lb-table th{
  text-align:left;font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-faint);font-weight:500;padding:0 12px 10px;border-bottom:1px solid var(--border);
}
.lb-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;}
.lb-table tr:last-child td{border-bottom:none;}
.lb-table .rank{font-family:'Big Shoulders';font-weight:700;font-size:15px;color:var(--text-faint);width:32px;}
.lb-table tr.me td{background:var(--accent-soft);}
.lb-table tr.me .rank{color:var(--accent);}
.addr{color:var(--text-dim);}
.bar-cell{width:120px;}
.mini-bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
.mini-bar > div{height:100%;background:var(--accent);}
.scroll-x{overflow-x:auto;}

.side-stack{display:flex;flex-direction:column;gap:16px;height:100%;}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-dim);display:inline-flex;align-items:center;gap:5px;}
.kv .v{font-weight:600;font-family:'IBM Plex Mono';font-size:12.5px;}
.token-mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'Big Shoulders';font-weight:800;font-size:16px;text-transform:uppercase;
}

.you-card{border:1px dashed var(--border);border-radius:var(--radius-m);padding:16px;background:var(--surface-2);}
.you-empty{font-size:13px;color:var(--text-dim);}

/* ============ FORMS / WIZARD ============ */
.wizard{display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start;}
.steps{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;}
.step-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;
  font-size:13px;color:var(--text-faint);
}
.step-item .idx{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:10px;flex:none;
}
.step-item.done{color:var(--text-dim);}
.step-item.done .idx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.step-item.current{color:var(--text);font-weight:600;background:var(--surface-2);}
.step-item.current .idx{border-color:var(--accent);color:var(--accent);}

.field{margin-bottom:20px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--text);}
.field .help{font-size:12px;color:var(--text-dim);margin-top:6px;}
.token-resolved{
  display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 12px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500;
}
.token-resolved.bad{background:var(--danger-soft);color:var(--danger);}
input[type=text],input[type=number]{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;
  padding:10px 12px;font-family:'IBM Plex Mono';font-size:13.5px;color:var(--text);
}
input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 15px;
  font-family:'IBM Plex Mono';font-size:12.5px;color:var(--text-dim);cursor:pointer;
}
.opt-btn.sel{background:var(--text);color:var(--bg);border-color:var(--text);}
.milestone-picker{display:flex;flex-direction:column;gap:10px;}
.ms-pick-row{
  display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:var(--radius-m);padding:12px 14px;
}
.ms-pick-row.on{border-color:var(--accent);background:var(--accent-soft);}
.ms-pick-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
.ms-pick-row .label{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;flex:1;}
.ms-pick-row .bps{width:90px;}
.bps-warn{font-size:12px;color:var(--danger);margin-top:8px;}
.bps-ok{font-size:12px;color:var(--sho);margin-top:8px;}

.summary-list{display:flex;flex-direction:column;}
.wizard-actions{display:flex;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);}

.empty-state{text-align:center;padding:64px 24px;color:var(--text-dim);}
.empty-state h3{color:var(--text);font-size:20px;margin-bottom:8px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:8px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow);z-index:100;
  display:flex;align-items:center;gap:10px;
}

@media (max-width: 880px){
  .wrap{padding:0 22px;}
  .hero-grid{grid-template-columns:1fr;}
  .hero h1{font-size:40px;}
  .detail-grid{grid-template-columns:1fr;}
  .wizard{grid-template-columns:1fr;}
  .steps{position:static;flex-direction:row;overflow-x:auto;}
  .grid-3, .how-grid, .value-grid{grid-template-columns:1fr;}
  .stat-groups{grid-template-columns:1fr;}
  .stat-group-body{grid-template-columns:1fr;}
  .stat-group-body .stat-tile{border-right:none;border-top:1px solid var(--border);}
  .stat-group-body .stat-tile:first-child{border-top:none;}
  .nav-links{display:none;}
  .profile-stats{grid-template-columns:1fr 1fr;}
  .created-grid{grid-template-columns:1fr;}
}

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<!-- Vendored (not CDN-pinned) so this stays in lockstep with the exact ethers version every
     other package in this repo uses (see e.g. ../api/package.json) -- copied straight from
     ethers' own dist/ethers.umd.min.js, see vendor/ETHERS_LICENSE.md. Exposes window.ethers. -->
<script src="vendor/ethers.umd.min.js"></script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useCallback, useRef} = React;

/* ===================== CONFIG ===================== */
// Everything here is a real, live-network value (Robinhood Chain Testnet, chain ID 46630 --
// see ../contracts/deployments/46630.json), not a placeholder. Override any of it without
// touching this file by setting `window.SCP_CONFIG = {...}` in a small inline <script> before
// this one loads (e.g. a per-deployment config.js Firebase Hosting serves alongside
// index.html) -- useful for pointing a preview build at a different API host.
const SCP_CONFIG = Object.assign({
  API_BASE_URL: 'http://localhost:3001',
  REGISTRATION_SERVICE_URL: 'http://localhost:3002',
  CHAIN_ID: 46630,
  CHAIN_NAME: 'Robinhood Chain Testnet',
  RPC_URL: 'https://rpc.testnet.chain.robinhood.com/rpc',
  EXPLORER_URL: 'https://explorer.testnet.chain.robinhood.com',
  NATIVE_SYMBOL: 'ETH',
  SHO_FACTORY_ADDRESS: '0x257F835b1066c064e9e9896c31556034f8Eee8c9',
  SSO_FACTORY_ADDRESS: '0x3770ae529595D0994297C35F7b75CEAD612749aa',
  REGISTRY_ADDRESS: '0xc2ed3d2b8CCa32B8cBC6F6a99D538129c1430065',
  // No stablecoin deployed on this testnet yet (PRD §5's USDC allowlist is an off-chain/
  // frontend policy, not contract-enforced -- see SHOFactory.sol's own createCampaign
  // comment). Set this once one exists; the wizard disables the USDC option while it's empty
  // rather than sending a made-up address on-chain.
  USDC_ADDRESS: '',
}, window.SCP_CONFIG || {});
const CHAIN_ID_HEX = '0x' + SCP_CONFIG.CHAIN_ID.toString(16);

/* ===================== CONTRACT INTERFACES ===================== */
// Minimal fragments this page actually calls -- mirrors ../api/src/abis.js (read side) plus
// the write calls (approve/createCampaign/claim/registerHandle) the API never needs to make.
// Duplicated rather than shared across packages for the same reason api/src/abis.js's own
// header gives: each package here is independently deployable.
const ERC20_ABI = [
  "function name() view returns (string)",
  "function symbol() view returns (string)",
  "function decimals() view returns (uint8)",
  "function balanceOf(address account) view returns (uint256)",
  "function allowance(address owner, address spender) view returns (uint256)",
  "function approve(address spender, uint256 amount) returns (bool)",
];
// Custom errors (not plain require strings) that OpenZeppelin v5 contracts revert with --
// ethers can't decode a revert into e.reason without knowing these, so shortError() below
// decodes them itself from e.data as a fallback. Covers the two ways a createCampaign() can
// revert on the reward-token transferFrom, and the one way an admin call like setAttestor
// reverts for the wrong caller -- all confirmed live in this project's own testing.
const KNOWN_ERRORS_ABI = [
  "error ERC20InsufficientBalance(address sender, uint256 balance, uint256 needed)",
  "error ERC20InsufficientAllowance(address spender, uint256 allowance, uint256 needed)",
  "error OwnableUnauthorizedAccount(address account)",
];
const KNOWN_ERRORS_IFACE = new window.ethers.Interface(KNOWN_ERRORS_ABI);
const CAMPAIGN_ABI = [
  // claim()'s signature is identical for SHOCampaign and SSOCampaign (see
  // ../api/src/claimRoutes.js's own header) so one fragment covers both.
  "function claim(uint256 index, uint256 amount, bytes32[] calldata proof) external",
  "function claimed(uint256 index, address account) view returns (bool)",
];
const SHO_FACTORY_ABI = [
  "function createCampaign(address token, address rewardToken, uint256 amount, uint8 window, uint16 leaderboardSize, uint256 duration, uint8[] tiers, uint16[] rewardBpsList) payable returns (address campaign)",
  "event CampaignCreated(uint256 indexed id, address indexed campaign, address indexed creator, address token, address rewardToken, uint256 totalLocked)",
];
const SSO_FACTORY_ABI = [
  "function createCampaign(address token, address rewardToken, uint256 amount, string keyword, uint8 epochLength, uint16 leaderboardSize, uint256 duration, uint16[] epochRewardBpsList) payable returns (address campaign)",
  "event CampaignCreated(uint256 indexed id, address indexed campaign, address indexed creator, address token, address rewardToken, uint256 totalLocked, string keyword)",
];
const REGISTRY_ABI = [
  "function handleOf(address) view returns (string)",
  "function registerHandle(string calldata xHandle, bytes calldata attestation) external",
];

// A read-only provider for calls that don't need a connected wallet (e.g. checking
// Registry.handleOf before/without a signer). Memoized so it's only constructed once.
let _readProvider = null;
function readProvider(){
  if(!window.ethers){ throw new Error('web3 library failed to load'); }
  if(!_readProvider) _readProvider = new window.ethers.JsonRpcProvider(SCP_CONFIG.RPC_URL);
  return _readProvider;
}

/* ===================== SMALL SHARED HELPERS (chain/network) ===================== */

function shortAddr(addr){
  if(!addr) return '';
  return addr.slice(0,6)+'...'+addr.slice(-4);
}
function explorerAddressUrl(addr){ return `${SCP_CONFIG.EXPLORER_URL}/address/${addr}`; }
function explorerTxUrl(hash){ return `${SCP_CONFIG.EXPLORER_URL}/tx/${hash}`; }

// Best-effort human message out of an ethers/JSON-RPC error -- these nest the actually useful
// string a few different ways depending on where the failure happened (wallet rejection vs.
// a contract revert vs. a network error), so check the specific spots before falling back to
// whatever's in .message (often a wall of raw RPC JSON).
// Best-effort decode of a custom-error revert ethers itself can't name (see KNOWN_ERRORS_ABI
// above) -- checks the handful of raw-data spots a failed call's error can carry that data in,
// depending on where in the request pipeline it surfaced.
function decodeKnownError(e){
  const data = e?.data || e?.info?.error?.data || e?.error?.data || e?.revert?.data;
  if(!data || typeof data !== 'string') return null;
  try {
    const parsed = KNOWN_ERRORS_IFACE.parseError(data);
    if(!parsed) return null;
    if(parsed.name==='ERC20InsufficientBalance'){
      const [,balance,needed] = parsed.args;
      return `Insufficient token balance: wallet has ${fmtTokenAmount(balance)}, needs ${fmtTokenAmount(needed)}.`;
    }
    if(parsed.name==='ERC20InsufficientAllowance'){
      const [,allowance,needed] = parsed.args;
      return `Insufficient allowance: approved ${fmtTokenAmount(allowance)}, needs ${fmtTokenAmount(needed)}.`;
    }
    if(parsed.name==='OwnableUnauthorizedAccount'){
      return `Connected wallet (${shortAddr(parsed.args[0])}) is not authorized to call this -- wrong wallet connected?`;
    }
  } catch(err){ /* not one of the errors we know how to decode */ }
  return null;
}
function shortError(e){
  if(!e) return 'unknown error';
  const decoded = decodeKnownError(e);
  if(decoded) return decoded;
  return e.reason || e.shortMessage || e?.info?.error?.message || e?.error?.message || e.message || String(e);
}

function parseQuery(qs){
  const out = {};
  new URLSearchParams(qs||'').forEach((v,k)=>{ out[k]=v; });
  return out;
}

// Prompts a wallet switch to Robinhood Chain Testnet, adding it first if the wallet has never
// seen this chain before (error code 4902 is EIP-3085's signal for exactly that case).
async function ensureChain(ethereum){
  try {
    await ethereum.request({ method:'wallet_switchEthereumChain', params:[{chainId:CHAIN_ID_HEX}] });
  } catch(switchErr){
    if(switchErr && switchErr.code===4902){
      await ethereum.request({ method:'wallet_addEthereumChain', params:[{
        chainId: CHAIN_ID_HEX,
        chainName: SCP_CONFIG.CHAIN_NAME,
        nativeCurrency: { name: SCP_CONFIG.NATIVE_SYMBOL, symbol: SCP_CONFIG.NATIVE_SYMBOL, decimals: 18 },
        rpcUrls: [SCP_CONFIG.RPC_URL],
        blockExplorerUrls: [SCP_CONFIG.EXPLORER_URL],
      }]});
    } else {
      throw switchErr;
    }
  }
}

/* ===================== API DATA LAYER ===================== */
// Replaces the old hand-authored SHO_CAMPAIGNS/SSO_CAMPAIGNS/TOKEN_REGISTRY/MY_*/
// CLAIM_HISTORY mock arrays with live reads from ../api (Stage 2, docs/BACKEND_ROADMAP.md) --
// a thin layer in front of the keeper's own Postgres + direct contract reads, never a second
// source of truth. One generic hook does the fetching; callers pass `null` for `path` to skip
// the request entirely (e.g. a wallet-scoped endpoint before any wallet is connected).
function useApiFetch(path, deps){
  const [state, setState] = useState({loading: path!==null, data:null, error:null});
  useEffect(()=>{
    if(path===null){ setState({loading:false, data:null, error:null}); return; }
    let cancelled = false;
    setState(s=>({...s, loading:true, error:null}));
    fetch(SCP_CONFIG.API_BASE_URL+path)
      .then(async (r)=>{
        const body = await r.json().catch(()=>({error:`non-JSON response (HTTP ${r.status})`}));
        if(!r.ok) throw new Error(body.error || `request failed (HTTP ${r.status})`);
        return body;
      })
      .then((body)=>{ if(!cancelled) setState({loading:false, data:body, error:null}); })
      .catch((e)=>{ if(!cancelled) setState({loading:false, data:null, error:e.message}); });
    return ()=>{ cancelled = true; };
    // eslint-disable-next-line
  }, deps);
  return state;
}

// windowSeconds/durationSeconds/epochSeconds from the API back to the '24H'/'7D'/'30D' /
// '7D'/'30D'/'90D' labels the rest of this file's UI already speaks in.
function secondsToWindowLabel(s){
  if(s===86400) return '24H';
  if(s===604800) return '7D';
  if(s===2592000) return '30D';
  return Math.round(s/86400)+'D';
}
function secondsToDurationLabel(s){ return Math.round(s/86400)+'D'; }

// Maps a shoRoutes.js campaign summary onto the shape CampaignCard/SHODetail already render.
function normalizeShoCampaign(c){
  return {
    id: c.id,
    token: c.token || shortAddr(c.tokenAddress),
    name: c.name || c.token || shortAddr(c.tokenAddress),
    tokenAddress: c.tokenAddress,
    rewardTokenAddress: c.rewardToken,
    creator: c.creator,
    contract: c.id,
    locked: c.locked, // raw units (18 decimals assumed, same as ../api/src/shoRoutes.js)
    denom: c.rewardTokenSymbol || c.token,
    window: secondsToWindowLabel(c.windowSeconds),
    size: c.leaderboardSize,
    duration: secondsToDurationLabel(c.durationSeconds),
    daysLeft: c.daysLeft,
    mcap: c.mcap,
    openedDaysAgo: Math.floor((Date.now()-new Date(c.createdAt).getTime())/86400000),
    milestones: c.milestones,
    topLeaderboard: c.topLeaderboard || null,
  };
}
function normalizeSsoCampaign(c){
  return {
    id: c.id,
    token: c.token || shortAddr(c.tokenAddress),
    name: c.name || c.token || shortAddr(c.tokenAddress),
    tokenAddress: c.tokenAddress,
    rewardTokenAddress: c.rewardToken,
    creator: c.creator,
    contract: c.id,
    keyword: c.keyword,
    locked: c.locked,
    denom: c.rewardTokenSymbol || c.token,
    epochLen: secondsToWindowLabel(c.epochSeconds),
    size: c.leaderboardSize,
    duration: secondsToDurationLabel(c.durationSeconds),
    openedDaysAgo: Math.floor((Date.now()-new Date(c.createdAt).getTime())/86400000),
    epochs: (c.epochs||[]).map(e=>({index: e.index, n: e.index+1, bps: e.bps, endsAt: e.endsAt, status: e.status})),
    currentEpochIndex: c.currentEpochIndex,
    topLeaderboard: c.topLeaderboard || null,
  };
}

/* ===================== MOCK DATA ===================== */

// Real, fixed tier ladder -- mirrors contracts/src/libraries/Types.sol's MilestoneTier enum
// ordering exactly (index = enum value, used as-is in CreateWizard's on-chain call) and
// api/src/abis.js's TIER_LABELS/MILESTONE_USD_THRESHOLDS.
const MS_TIERS = [
  {id:'100K', label:'$100K', value:100000},
  {id:'250K', label:'$250K', value:250000},
  {id:'1M',   label:'$1M',   value:1000000},
  {id:'5M',   label:'$5M',   value:5000000},
];

// Per-wallet/per-X-account activity (positions, claims, created campaigns) now comes from
// GET /wallets/:address/{standings,claims,created} -- see useWalletStandings/useWalletClaims/
// useWalletCreated further down, used directly in SHODetail/SSODetail/Profile. A live
// leaderboard preview comes bundled into each campaign's own detail response
// (topLeaderboard, up to 10 entries) rather than a locally-fabricated one.

/* ===================== SHARED HELPERS ===================== */

function fmtNum(n){
  if(n>=1000000) return (n/1000000).toFixed(2).replace(/\.00$/,'')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'K';
  return String(Math.round(n));
}
function fmtUSD(n){ return '$'+fmtNum(n); }
// API amounts (c.locked, wallet standings/claims amounts) are raw on-chain integers as
// strings, 18 decimals assumed throughout this project (same assumption api/src/shoRoutes.js
// itself makes for totalSupply -- see its tokenTwapMcap). Converts to a plain JS number for
// display via fmtNum/fmtUSD; fine at this scale, not used for anything that computes a claim.
function fmtTokenAmount(raw){
  if(raw==null) return 0;
  try { return Number(window.ethers.formatUnits(raw, 18)); } catch(e){ return 0; }
}
function pctToNext(mcap, tiers){
  const next = tiers.find(t=>t.value>mcap) || tiers[tiers.length-1];
  const prevIdx = tiers.indexOf(next)-1;
  const prev = prevIdx>=0 ? tiers[prevIdx].value : 0;
  const pct = Math.max(0,Math.min(100, ((mcap-prev)/(next.value-prev))*100));
  return {next, pct};
}
// The tiers a specific SHO campaign actually funds (a subset of MS_TIERS the creator turned on),
// so progress/next-tier math never points at a milestone that has no reward allocated to it.
function campaignTiers(c){
  return c.milestones.map(m=>MS_TIERS.find(t=>t.id===m.tier)).filter(Boolean);
}
// A campaign has a "live" tier right now if any milestone/epoch is actively tracking or claimable.
function hasActiveTier(c){
  const steps = c.milestones || c.epochs || [];
  return steps.some(s=>s.status==='active'||s.status==='claimable');
}
const NEW_THRESHOLD_DAYS = 3;

function useHashRoute(){
  const [route,setRoute] = useState(window.location.hash.slice(1) || '/');
  useEffect(()=>{
    const onHash = ()=> { setRoute(window.location.hash.slice(1) || '/'); window.scrollTo(0,0); };
    window.addEventListener('hashchange', onHash);
    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);
  const go = useCallback((r)=>{ window.location.hash = r; }, []);
  return [route, go];
}

// Real wallet connection (window.ethereum / EIP-1193, e.g. MetaMask) plus the wallet's actual
// on-chain X-handle link (Registry.handleOf) -- replaces useMockUser's instant fake connect.
// xhandle is deliberately never cached in localStorage: Registry.handleOf(wallet) is the one
// source of truth (PRD §12.3-12.4), so this always re-reads it rather than risk showing a
// stale cached handle after a wallet switch or a fresh registerHandle() call elsewhere.
function useWallet(){
  const [wallet, setWallet] = useState(null);
  const [xhandle, setXhandle] = useState(null);
  const [connecting, setConnecting] = useState(false);
  const [chainOk, setChainOk] = useState(true);

  const refreshXHandle = useCallback(async (addr)=>{
    const target = addr || wallet;
    if(!target){ setXhandle(null); return; }
    try {
      const registry = new window.ethers.Contract(SCP_CONFIG.REGISTRY_ADDRESS, REGISTRY_ABI, readProvider());
      const handle = await registry.handleOf(target);
      setXhandle(handle && handle.length ? handle : null);
    } catch(e){
      console.error('failed to read Registry.handleOf', e);
    }
  }, [wallet]);

  const applyAccounts = useCallback((accounts)=>{
    const addr = accounts && accounts[0] ? window.ethers.getAddress(accounts[0]) : null;
    setWallet(addr);
    if(addr) refreshXHandle(addr); else setXhandle(null);
  }, [refreshXHandle]);

  useEffect(()=>{
    const {ethereum} = window;
    if(!ethereum) return;
    // Silent -- eth_accounts never prompts, so this only restores a connection the site
    // already has permission for (e.g. after a reload), it never pops MetaMask on its own.
    ethereum.request({method:'eth_accounts'}).then(applyAccounts).catch(()=>{});
    ethereum.request({method:'eth_chainId'}).then(id=> setChainOk(id===CHAIN_ID_HEX)).catch(()=>{});
    const onAccounts = (accounts)=> applyAccounts(accounts);
    const onChain = (id)=> setChainOk(id===CHAIN_ID_HEX);
    ethereum.on && ethereum.on('accountsChanged', onAccounts);
    ethereum.on && ethereum.on('chainChanged', onChain);
    return ()=>{
      ethereum.removeListener && ethereum.removeListener('accountsChanged', onAccounts);
      ethereum.removeListener && ethereum.removeListener('chainChanged', onChain);
    };
    // eslint-disable-next-line
  }, []);

  const connectWallet = useCallback(async ()=>{
    const {ethereum} = window;
    if(!ethereum){
      alert('No wallet extension found. Install MetaMask (or another EIP-1193 wallet) to continue.');
      return;
    }
    setConnecting(true);
    try {
      const accounts = await ethereum.request({method:'eth_requestAccounts'});
      applyAccounts(accounts);
      await ensureChain(ethereum);
      setChainOk(true);
    } catch(e){
      console.error(e);
      alert('Wallet connection failed: '+shortError(e));
    } finally {
      setConnecting(false);
    }
  }, [applyAccounts]);

  // Kicks off the real OAuth 2.0 (PKCE) redirect to ../registration-service. Requires a
  // connected wallet since the attestation it comes back with is bound to that address --
  // callers already gate this behind !!wallet (see Register/SSODetail).
  const connectX = useCallback(()=>{
    if(!wallet) return;
    window.location.href = `${SCP_CONFIG.REGISTRATION_SERVICE_URL}/auth/x/start?wallet=${wallet}`;
  }, [wallet]);

  const disconnect = useCallback(()=>{
    // A dapp can't force MetaMask to actually disconnect (no permission-revoke API); this
    // just forgets the connection locally, matching the mock's own disconnect semantics.
    setWallet(null); setXhandle(null);
  }, []);

  const getSigner = useCallback(async ()=>{
    if(!window.ethereum) throw new Error('no wallet extension found');
    const provider = new window.ethers.BrowserProvider(window.ethereum);
    await ensureChain(window.ethereum);
    return provider.getSigner();
  }, []);

  return {wallet, xhandle, connecting, chainOk, connectWallet, connectX, disconnect, getSigner, refreshXHandle};
}

// Tweens 0 -> target on mount with an ease-out curve; snaps instantly for reduced-motion.
function useCountUp(target, duration=1200){
  const [val, setVal] = useState(0);
  useEffect(()=>{
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ setVal(target); return; }
    let raf, start;
    const tick = (t)=>{
      if(start===undefined) start = t;
      const p = Math.min(1, (t-start)/duration);
      setVal(target*(1-Math.pow(1-p,3)));
      if(p<1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

function VaultDial(){
  const pct = useCountUp(62, 1400);
  const amount = useCountUp(2.44, 1400);
  const r = 42, c = 2*Math.PI*r;
  return (
    <div className="vault">
      <div className="vault-sweep" aria-hidden="true"></div>
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r={r} fill="none" stroke="var(--surface-2)" strokeWidth="7"/>
        <circle cx="50" cy="50" r={r} fill="none" stroke="var(--accent)" strokeWidth="7"
          strokeDasharray={c} strokeDashoffset={c*(1-pct/100)} strokeLinecap="round"
          transform="rotate(-90 50 50)"/>
        {MS_TIERS.map((t,i)=>{
          const ang = -90 + (i/(MS_TIERS.length-1))*270;
          const rad = ang*Math.PI/180;
          const x = 50 + (r)*Math.cos(rad), y = 50 + (r)*Math.sin(rad);
          return <circle key={t.id} cx={x} cy={y} r="2.2" fill={i<=1?'var(--accent)':'var(--border)'}/>;
        })}
      </svg>
      <div className="vault-center">
        <span className="num">${amount.toFixed(2)}M</span>

      </div>
    </div>
  );
}

const PAGE_SIZE = 6;

function Discover({kind, go}){
  const isSHO = kind==='sho';
  const {loading, data, error} = useApiFetch(`/${kind}/campaigns`, [kind]);
  const fullList = useMemo(()=>{
    if(!data) return [];
    return data.campaigns.map(isSHO ? normalizeShoCampaign : normalizeSsoCampaign);
  }, [data, isSHO]);
  const [filter,setFilter] = useState('all');
  const [page,setPage] = useState(0);

  useEffect(()=>{ setPage(0); }, [kind, filter]);

  const list = useMemo(()=>{
    if(filter==='active') return fullList.filter(hasActiveTier);
    if(filter==='new') return fullList.filter(c=>c.openedDaysAgo<=NEW_THRESHOLD_DAYS);
    return fullList;
  }, [fullList, filter]);

  const pageCount = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const clampedPage = Math.min(page, pageCount-1);
  const pageItems = list.slice(clampedPage*PAGE_SIZE, clampedPage*PAGE_SIZE + PAGE_SIZE);
  const fromN = list.length===0 ? 0 : clampedPage*PAGE_SIZE + 1;
  const toN = Math.min(list.length, clampedPage*PAGE_SIZE + PAGE_SIZE);

  return (
    <div className="page">

            <button key={f} className={`pill-btn ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f==='all'?'All campaigns':f==='active'?'Milestone active':'Recently opened'}</button>
          ))}
        </div>
        {loading ? (
          <div className="empty-state"><h3>Loading campaigns&hellip;</h3><p>Reading {isSHO?'SHO':'SSO'} campaigns from the API.</p></div>
        ) : error ? (
          <div className="empty-state"><h3>Couldn&rsquo;t load campaigns</h3><p>{error}</p></div>
        ) : list.length===0 ? (
          <div className="empty-state">
            <h3>No campaigns match this filter</h3>
            <p>{filter==='active' ? "None of the current campaigns have a live milestone right now." : "Nothing opened in the last "+NEW_THRESHOLD_DAYS+" days."} Try &ldquo;All campaigns&rdquo; instead.</p>

          <>
            <div className="grid-3">
              {pageItems.map(c=> <CampaignCard key={c.id} c={c} kind={kind} onOpen={()=>go(`/${kind}/${c.id}`)}/> )}
            </div>
            <div className="pagination">
              <span className="pagination-count mono">{fromN}&ndash;{toN} of {list.length}</span>
              <div className="pagination-nav">
                <button className="page-btn" disabled={clampedPage===0} onClick={()=>setPage(p=>Math.max(0,p-1))}><IcoArrowRight size={14} style={{transform:'rotate(180deg)'}}/>Previous</button>
                <span className="page-indicator mono">Page {clampedPage+1} of {pageCount}</span>
                <button className="page-btn" disabled={clampedPage>=pageCount-1} onClick={()=>setPage(p=>Math.min(pageCount-1,p+1))}>Next<IcoArrowRight size={14}/></button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ===================== SHARE CARDS (gamification / social loop) ===================== */
// Renders a shareable 1080x1080 PNG summarizing a campaign (for its creator to post right
// after launch) or a wallet's live standing in it (for a trader/shiller who joined) -- this is
// an engagement layer on top of the spec, not something PRD.md/BACKEND_ROADMAP.md calls for.
// Drawn with plain Canvas 2D rather than a DOM-to-image trick (html2canvas/dom-to-image, or an
// SVG <foreignObject> rasterized via drawImage) specifically so nothing here ever calls
// drawImage() on cross-origin content -- that is the one thing that taints a canvas and blocks
// toBlob()/toDataURL() afterward. fillText() with the Google Fonts this page already loads
// (see the @import a few hundred lines up) does not taint a canvas; only drawImage() of
// unauthorized cross-origin image data does, and this module never calls it.
//
// No server-side OG-image endpoint (a /campaigns/:address/card.png route unfurling nicely when
// the campaign link is pasted into X/Telegram/Discord) exists yet -- this SPA's meta tags are
// client-rendered, so link-unfurl bots wouldn't see them anyway without a small edge/middleware
// piece in front of Firebase Hosting. Shipping the simpler path first: the Share button attaches
// the rendered PNG directly (Web Share API) or downloads it for manual attach, with the
// campaign link carried in the post's own text instead of embedded in the image or relying on
// unfurl. Revisit the server-rendered route if/when unfurl previews are worth the extra infra.

function crRoundRect(ctx, x, y, w, h, r){
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// Decorative candlestick + Bollinger-band watermark, drawn once at a fixed shape and reused
// across every card (colored per campaign type) -- pure texture, not real chart data.
function drawChartBg(ctx, x, y, w, h, upColor){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(w/900, h/260);
  ctx.globalAlpha = 0.15;
  const mid = [[20,208],[90,202],[120,190],[180,190],[240,190],[260,165],[320,165],[380,165],[400,145],[460,145],[520,145],[540,122],[600,122],[660,122],[680,100],[740,100],[780,100],[800,82],[860,80]];
  const drawBand = (dy, dashed) => {
    ctx.beginPath();
    mid.forEach(([px,py], i)=>{ i===0 ? ctx.moveTo(px, py+dy) : ctx.lineTo(px, py+dy); });
    ctx.strokeStyle = upColor; ctx.lineWidth = 2;
    ctx.setLineDash(dashed ? [7,7] : []);
    ctx.stroke();
  };
  drawBand(0, false);
  drawBand(-30, true);
  drawBand(30, true);
  ctx.setLineDash([]);
  const candles = [
    [40,200,215,192,222,1],[103,190,205,182,212,1],[166,195,210,188,216,0],
    [229,175,195,168,202,1],[292,160,178,152,185,1],[355,168,182,160,190,0],
    [418,145,165,138,172,1],[481,130,150,122,158,1],[544,138,155,130,162,0],
    [607,110,132,102,140,1],[670,95,115,88,122,1],[733,100,118,92,126,0],
    [796,75,98,68,105,1],
  ];
  for(const [cx,top,bottom,wt,wb,up] of candles){
    ctx.fillStyle = up ? upColor : '#71805A';
    ctx.strokeStyle = up ? upColor : '#71805A';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx+11, wt); ctx.lineTo(cx+11, wb); ctx.stroke();
    ctx.fillRect(cx, top, 22, bottom-top);
  }
  ctx.restore();
}

// data shape: { accent, badgeBg, badgeText, badgeLabel, mutedBorder, statusRight:{type,text},
// eyebrow, keywordChip, hero:{type:'amount',amount,denom}|{type:'rank',value,ofText},
// chips:[{label,value,accent}], railLabels:[a,b,c], footerLine1, footerUrl }
async function drawShareCard(canvas, d){
  await Promise.all([
    document.fonts.load("800 110px 'Big Shoulders'"),
    document.fonts.load("700 40px 'Big Shoulders'"),
    document.fonts.load("700 17px 'Big Shoulders'"),
    document.fonts.load("500 16px 'IBM Plex Mono'"),
    document.fonts.load("400 16px 'IBM Plex Sans'"),
  ]).catch(()=>{});

  const W = 1080, H = 1080, PAD = 64;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#111409'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(198,242,62,0.05)'; ctx.lineWidth = 1;
  for(let x=0; x<=W; x+=64){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0; y<=H; y+=64){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // topbar: wordmark left, status + type badge right
  ctx.save();
  ctx.translate(PAD+6, PAD+9); ctx.rotate(Math.PI/4);
  ctx.fillStyle = d.accent; ctx.fillRect(-6, -6, 12, 12);
  ctx.restore();
  ctx.fillStyle = '#A3B383'; ctx.font = "700 17px 'Big Shoulders'";
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText('STRONG COMMITMENT PROTOCOL', PAD+22, PAD+9);

  let rx = W - PAD;
  ctx.font = "700 15px 'Big Shoulders'";
  const badgeW = ctx.measureText(d.badgeLabel).width + 36;
  crRoundRect(ctx, rx-badgeW, PAD-8, badgeW, 34, 17);
  ctx.fillStyle = d.badgeBg; ctx.fill();
  ctx.fillStyle = d.badgeText; ctx.textAlign = 'center';
  ctx.fillText(d.badgeLabel, rx-badgeW/2, PAD+9);
  rx -= badgeW + 14;

  ctx.font = "500 13px 'IBM Plex Mono'";
  const statusText = d.statusRight.text.toUpperCase();
  const statusW = ctx.measureText(statusText).width;
  if(d.statusRight.type === 'dot'){
    ctx.beginPath(); ctx.arc(rx-statusW-13, PAD+9, 3.5, 0, Math.PI*2); ctx.fillStyle = d.accent; ctx.fill();
  }
  ctx.fillStyle = '#71805A'; ctx.textAlign = 'right';
  ctx.fillText(statusText, rx, PAD+9);

  // hero
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const y = PAD + 126;
  if(d.eyebrow){
    ctx.fillStyle = '#71805A'; ctx.font = "500 16px 'IBM Plex Mono'";
    const eyebrowText = d.eyebrow.toUpperCase();
    ctx.fillText(eyebrowText, PAD, y);
    if(d.keywordChip){
      const ew = ctx.measureText(eyebrowText).width;
      const kx = PAD+ew+16, kw = ctx.measureText(d.keywordChip).width+26;
      crRoundRect(ctx, kx, y-20, kw, 28, 6);
      ctx.fillStyle = d.badgeBg; ctx.fill();
      ctx.fillStyle = d.accent; ctx.font = "500 14px 'IBM Plex Mono'";
      ctx.fillText(d.keywordChip, kx+13, y-1);
    }
  }
  let chipsTop;
  if(d.hero.type === 'amount'){
    ctx.fillStyle = '#F1F6DE'; ctx.font = "800 110px 'Big Shoulders'";
    ctx.fillText(d.hero.amount, PAD, y+130);
    ctx.fillStyle = d.accent; ctx.font = "700 40px 'Big Shoulders'";
    ctx.fillText(d.hero.denom, PAD, y+182);
    chipsTop = y + 236;
  } else {
    ctx.fillStyle = '#A3B383'; ctx.font = "700 30px 'Big Shoulders'";
    ctx.fillText('RANK', PAD, y+40);
    const rw = ctx.measureText('RANK').width;
    ctx.fillStyle = d.accent; ctx.font = "800 148px 'Big Shoulders'";
    ctx.fillText(d.hero.value, PAD+rw+26, y+118);
    ctx.fillStyle = '#71805A'; ctx.font = "500 16px 'IBM Plex Mono'";
    ctx.fillText(d.hero.ofText, PAD, y+160);
    chipsTop = y + 210;
  }

  // chips
  const gap = 14, chipW = (W-PAD*2-gap*2)/3, chipH = 84;
  d.chips.forEach((chip, i) => {
    const cx = PAD + i*(chipW+gap);
    crRoundRect(ctx, cx, chipsTop, chipW, chipH, 12);
    ctx.fillStyle = '#181D12'; ctx.fill();
    ctx.strokeStyle = '#232C13'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#71805A'; ctx.font = "500 12px 'IBM Plex Mono'";
    ctx.fillText(chip.label.toUpperCase(), cx+22, chipsTop+30);
    ctx.fillStyle = chip.accent ? d.accent : '#F1F6DE';
    ctx.font = "700 22px 'Big Shoulders'";
    ctx.fillText(chip.value, cx+22, chipsTop+62);
  });

  drawChartBg(ctx, PAD, chipsTop+chipH+50, W-PAD*2, 260, d.accent);

  // rail
  const railY = H - PAD - 208, nodeR = 14;
  const nodes = [
    {x: PAD+nodeR, label: d.railLabels[0], done: true},
    {x: PAD + (W-PAD*2)*0.5, label: d.railLabels[1], done: false},
    {x: W-PAD-nodeR, label: d.railLabels[2], done: false},
  ];
  ctx.strokeStyle = '#232C13'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(nodes[0].x, railY); ctx.lineTo(nodes[2].x, railY); ctx.stroke();
  nodes.forEach(n => {
    ctx.beginPath(); ctx.arc(n.x, railY, nodeR, 0, Math.PI*2);
    if(n.done){ ctx.fillStyle = d.accent; ctx.fill(); }
    else { ctx.fillStyle = '#181D12'; ctx.fill(); ctx.strokeStyle = d.mutedBorder; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = n.done ? d.accent : '#71805A';
    ctx.font = "500 11.5px 'IBM Plex Mono'"; ctx.textAlign = 'center';
    ctx.fillText(n.label.toUpperCase(), n.x, railY+34);
  });
  ctx.textAlign = 'left';

  // footer
  const footerBorderY = H - PAD - 108;
  ctx.strokeStyle = 'rgba(241,246,222,0.08)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, footerBorderY); ctx.lineTo(W-PAD, footerBorderY); ctx.stroke();
  let fy = footerBorderY + 40;
  if(d.footerLine1){
    ctx.fillStyle = '#A3B383'; ctx.font = "400 16px 'IBM Plex Sans'";
    ctx.fillText(d.footerLine1, PAD, fy);
    fy += 34;
  }
  ctx.fillStyle = '#A3B383'; ctx.font = "500 16px 'IBM Plex Mono'";
  ctx.fillText(d.footerUrl, PAD, fy);

  return canvas;
}

// The campaign's own hash-routed page -- pasted into a post's text (never encoded into the
// image itself; see this section's header for why there's no QR/URL baked into the PNG).
function shareCardUrl(kind, campaignId){
  return `${window.location.origin}${window.location.pathname}#/${kind}/${campaignId}`;
}

// Builds one card's full data + share caption from real campaign/standing state -- never
// invented numbers, same "reconstructible from real data" posture the rest of this frontend
// already follows for its non-mock fields.
function buildShareCardData(kind, role, c, standing){
  const isSho = kind === 'sho';
  const accent = isSho ? '#C6F23E' : '#8CA6E0';
  const badgeBg = isSho ? '#332A17' : '#1E273B';
  const badgeText = isSho ? '#DDB05C' : '#8CA6E0';
  const mutedBorder = isSho ? '#2C3620' : '#2A3348';
  const url = shareCardUrl(kind, c.id);
  const shortUrl = url.replace(/^https?:\/\//, '').replace(/^www\./, '');
  const lockedAmount = `${fmtNum(fmtTokenAmount(c.locked))} ${c.denom}`;
  const railLabels = ['Lock', isSho ? 'Milestone' : 'Epoch Close', 'Payout'];
  const base = { accent, badgeBg, badgeText, mutedBorder, badgeLabel: isSho ? 'SHO' : 'SSO', railLabels, footerUrl: shortUrl };

  if(role === 'creator'){
    const chips = isSho
      ? [
          {label: 'Duration', value: c.duration},
          {label: 'Leaderboard', value: `Top ${c.size} Traders`},
          {label: 'Milestones', value: `${c.milestones.length} Tiers`},
        ]
      : [
          {label: 'Duration', value: c.duration},
          {label: 'Epoch', value: `Every ${c.epochLen}`},
          {label: 'Winners', value: `Top ${c.size} / Epoch`},
        ];
    return {
      ...base,
      statusRight: {type: 'dot', text: 'Campaign live'},
      eyebrow: `${c.token} · reward pool locked`,
      keywordChip: isSho ? null : c.keyword,
      hero: {type: 'amount', amount: fmtNum(fmtTokenAmount(c.locked)), denom: c.denom},
      chips,
      footerLine1: null,
      caption: `${c.token} ${isSho ? 'SHO' : 'SSO'} campaign is live — ${lockedAmount} locked for the community. ${url}`,
      url,
    };
  }

  const rank = standing ? `#${standing.rank}` : '—';
  const chips = isSho
    ? [
        {label: 'My Net-Buy Vol', value: standing ? fmtUSD(fmtTokenAmount(standing.score)) : '—', accent: true},
        {label: 'Reward Pool', value: lockedAmount},
        {label: 'Of', value: `Top ${c.size}`},
      ]
    : [
        {label: 'My Score', value: standing ? `${fmtNum(standing.score)} Pts` : '—', accent: true},
        {label: 'Reward Pool', value: lockedAmount},
        {label: 'Of', value: `Top ${c.size}`},
      ];
  return {
    ...base,
    statusRight: {type: 'tag', text: isSho ? 'Wallet' : 'X Account'},
    eyebrow: `${c.token} · ${isSho ? 'SHO' : 'SSO'} · my standing`,
    keywordChip: isSho ? null : c.keyword,
    hero: {type: 'rank', value: rank, ofText: `of Top ${c.size}`},
    chips,
    footerLine1: isSho ? `Trade ${c.token} to climb the leaderboard —` : `Post ${c.keyword} to join the leaderboard —`,
    caption: isSho
      ? `I'm ranked ${rank} on ${c.token}'s SHO leaderboard — competing for a share of the pool. ${url}`
      : `I'm ranked ${rank} shilling ${c.keyword} on ${c.token}'s SSO leaderboard. ${url}`,
    url,
  };
}

function ShareCardModal({kind, role, campaign, standing, onClose}){
  const canvasRef = useRef(null);
  const [ready, setReady] = useState(false);
  const data = useMemo(() => buildShareCardData(kind, role, campaign, standing), [kind, role, campaign, standing]);

  useEffect(() => {
    let cancelled = false;
    setReady(false);
    if(canvasRef.current){
      drawShareCard(canvasRef.current, data).then(() => { if(!cancelled) setReady(true); });
    }
    return () => { cancelled = true; };
  }, [data]);

  const fileName = `${campaign.token.replace(/[^a-z0-9]/gi, '')}-${kind}-${role}.png`;
  const toBlob = () => new Promise(resolve => canvasRef.current.toBlob(resolve, 'image/png'));

  const doDownload = async () => {
    const blob = await toBlob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  const doShare = async () => {
    try {
      const blob = await toBlob();
      const file = new File([blob], fileName, {type: 'image/png'});
      if(navigator.canShare && navigator.canShare({files: [file]})){
        await navigator.share({files: [file], text: data.caption, title: 'Strong Commitment Protocol'});
        return;
      }
    } catch(e){
      if(e && e.name === 'AbortError') return; // user closed the native share sheet
    }
    // No Web Share API (most desktop browsers) -- open a pre-filled X post (link travels in
    // the post text, per this feature's own "no QR, no unfurl backend yet" call) and download
    // the PNG alongside so it can be attached to that post by hand.
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(data.caption)}`, '_blank', 'noopener');
    doDownload();
  };

  return (
    <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:200, padding:20}} onClick={onClose}>
      <div className="panel" style={{maxWidth:420, width:'100%'}} onClick={e => e.stopPropagation()}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14}}>
          <div style={{fontWeight:600}}>Share {role === 'creator' ? 'campaign' : 'your standing'}</div>
          <button onClick={onClose} style={{background:'none', border:'none', color:'var(--text-dim)', cursor:'pointer', padding:4}}><IcoX size={16}/></button>
        </div>
        <div style={{borderRadius:12, overflow:'hidden', border:'1px solid var(--border)', marginBottom:16, background:'#111409'}}>
          <canvas ref={canvasRef} style={{width:'100%', display:'block', aspectRatio:'1 / 1'}}/>
        </div>
        <div style={{display:'flex', gap:10}}>
          <Btn block icon={IcoShare} onClick={doShare} disabled={!ready}>Share</Btn>
          <Btn block kind="outline" onClick={doDownload} disabled={!ready}>Download image</Btn>
        </div>
      </div>
    </div>
  );
}

/* ===================== SHO DETAIL ===================== */

function SHODetail({id, go, user, notify}){
  const [refreshTick, setRefreshTick] = useState(0);
  const {loading, data, error} = useApiFetch(`/sho/campaigns/${id}`, [id, refreshTick]);
  const c = useMemo(()=> data ? normalizeShoCampaign(data) : null, [data]);
  const tokenProfile = useApiFetch(c ? `/tokens/${c.tokenAddress}` : null, [c && c.tokenAddress]);
  const standings = useApiFetch(user.wallet ? `/wallets/${user.wallet}/standings` : null, [user.wallet, refreshTick]);
  const claims = useApiFetch(user.wallet ? `/wallets/${user.wallet}/claims` : null, [user.wallet, refreshTick]);
  const [claiming, setClaiming] = useState(null);
  const [shareRole, setShareRole] = useState(null); // null | 'creator' | 'participant'

  if(loading) return <div className="page"><div className="wrap"><div className="empty-state"><h3>Loading campaign&hellip;</h3></div></div></div>;
  if(error || !c) return <EmptyRoute go={go}/>;

  const tiers = campaignTiers(c);
  const {next, pct} = pctToNext(c.mcap||0, tiers);
  const allTiersReached = c.mcap!=null && c.mcap >= tiers[tiers.length-1].value;
  const profile = tokenProfile.data;
  const myStanding = standings.data ? standings.data.sho.find(s=>s.campaignAddress.toLowerCase()===c.id.toLowerCase()) : null;
  const myClaims = claims.data ? claims.data.claims.filter(cl=>cl.factory==='sho' && cl.campaignAddress.toLowerCase()===c.id.toLowerCase()) : [];
  const anyOpen = c.milestones.some(m=>m.status==='pending'||m.status==='active');

  const doClaim = async (m)=>{
    if(!user.wallet){ notify('Connect a wallet first to claim.'); return; }
    const mine = myClaims.find(cl=>cl.index===m.index);
    if(!mine){ notify("You're not on this milestone's leaderboard snapshot -- nothing to claim."); return; }
    setClaiming(m.index);
    try {
      const res = await fetch(`${SCP_CONFIG.API_BASE_URL}/campaigns/${c.id}/claim-proof?wallet=${user.wallet}&index=${m.index}`);
      const body = await res.json();
      if(!res.ok) throw new Error(body.error || 'failed to fetch claim proof');
      const signer = await user.getSigner();
      const campaign = new window.ethers.Contract(c.id, CAMPAIGN_ABI, signer);
      const tx = await campaign.claim(m.index, body.amount, body.proof);
      notify('Claim submitted -- waiting for confirmation...');
      await tx.wait();
      notify(`Claimed the ${m.tier} tier.`);
      setRefreshTick(t=>t+1);
    } catch(e){
      notify('Claim failed: '+shortError(e));
    } finally {
      setClaiming(null);
    }
  };

  return (
    <div className="page">
      <div className="wrap">
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / <button onClick={()=>go('/sho')}>SHO</button> / {c.token}</div>
        <div className="page-head">
          <div>
            <h1>{c.token} <span style={{color:'var(--text-faint)'}}>&middot; SHO</span></h1>
            <div className="camp-meta">Creator {shortAddr(c.creator)} &middot; {c.window} window &middot; Top {c.size} &middot; {c.duration} duration</div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {user.wallet && c.creator && user.wallet.toLowerCase()===c.creator.toLowerCase() && (
              <Btn kind="outline" size="sm" icon={IcoShare} onClick={()=>setShareRole('creator')}>Share</Btn>
            )}
            <Tag kind="sho">{anyOpen ? 'Active' : 'Completed'}</Tag>
          </div>
        </div>

        <div className="detail-grid">
          <div className="side-stack">
            <div className="panel">
              <div className="eyebrow" style={{marginBottom:10,display:'flex',alignItems:'center',gap:6}}><IcoTarget size={13}/>Milestone progress</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}>
                <span className="mono" style={{fontSize:22,fontWeight:600}}>{c.mcap==null ? 'TWAP pending' : fmtUSD(c.mcap)}</span>
                <span className="camp-meta">{allTiersReached ? 'all funded tiers reached' : `next: ${next.label}`}</span>
              </div>
              <Meter pct={pct}/>
              <div className="milestone-list" style={{marginTop:20}}>
                {c.milestones.map(m=>{
                  const mine = myClaims.find(cl=>cl.index===m.index);
                  const walletStatus = mine ? mine.status : m.status; // per-wallet when we have it
                  return (
                  <div key={m.index} className={`milestone-row ${walletStatus==='claimed'?'reached':walletStatus==='claimable'?'claimable':walletStatus==='active'?'reached':''}`}>
                    <div className="ms-icon"><MsIcon status={walletStatus}/></div>
                    <div className="ms-body">
                      <div className="ms-title">{m.tier} mcap &middot; {m.bps/100}% of pool</div>
                      <div className="ms-sub">
                        {m.status==='pending' && 'Not yet reached'}
                        {m.status==='active' && 'Currently the closest tier to being reached'}
                        {m.status==='challenge_window' && 'Reached · 24h challenge window before claims open'}
                        {m.status==='claimed' && (walletStatus==='claimed' ? 'You claimed this tier' : 'Reached · distributed to top traders')}
                        {m.status==='claimable' && 'Challenge window cleared · claim open'}
                      </div>
                    </div>
                    {m.status==='claimable' && walletStatus!=='claimed' && (
                      mine
                        ? <Btn size="sm" icon={IcoCheckCirc} disabled={claiming===m.index} onClick={()=>doClaim(m)}>{claiming===m.index?'Claiming…':'Claim'}</Btn>
                        : (user.wallet ? <Tag kind="neutral">Not eligible</Tag> : <Btn size="sm" icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn>)
                    )}
                    {walletStatus==='claimed' && <Tag kind="sho" icon={IcoCheckCirc}>Claimed</Tag>}
                  </div>
                  );
                })}
              </div>
            </div>

            <div className="panel">

function SSODetail({id, go, user, notify}){
  const [refreshTick, setRefreshTick] = useState(0);
  const {loading, data, error} = useApiFetch(`/sso/campaigns/${id}`, [id, refreshTick]);
  const c = useMemo(()=> data ? normalizeSsoCampaign(data) : null, [data]);
  const tokenProfile = useApiFetch(c ? `/tokens/${c.tokenAddress}` : null, [c && c.tokenAddress]);
  const standings = useApiFetch(user.wallet ? `/wallets/${user.wallet}/standings` : null, [user.wallet, refreshTick]);
  const claims = useApiFetch(user.wallet ? `/wallets/${user.wallet}/claims` : null, [user.wallet, refreshTick]);
  const [claiming, setClaiming] = useState(null);
  const [shareRole, setShareRole] = useState(null); // null | 'creator' | 'participant'

  if(loading) return <div className="page"><div className="wrap"><div className="empty-state"><h3>Loading campaign&hellip;</h3></div></div></div>;
  if(error || !c) return <EmptyRoute go={go}/>;

  const activeEpoch = c.epochs.find(e=>e.status==='active');
  const epochLabel = activeEpoch ? `Epoch ${activeEpoch.n} of ${c.epochs.length}`
    : c.epochs.every(e=>e.status==='pending') ? 'Not started yet' : 'Between epochs';
  const profile = tokenProfile.data;
  const myStanding = standings.data ? standings.data.sso.find(s=>s.campaignAddress.toLowerCase()===c.id.toLowerCase()) : null;
  const myClaims = claims.data ? claims.data.claims.filter(cl=>cl.factory==='sso' && cl.campaignAddress.toLowerCase()===c.id.toLowerCase()) : [];

  const doClaim = async (e)=>{
    if(!user.wallet){ notify('Connect a wallet first to claim.'); return; }
    const mine = myClaims.find(cl=>cl.index===e.index);
    if(!mine){ notify("You're not on this epoch's leaderboard snapshot -- nothing to claim."); return; }
    setClaiming(e.index);
    try {
      const res = await fetch(`${SCP_CONFIG.API_BASE_URL}/campaigns/${c.id}/claim-proof?wallet=${user.wallet}&index=${e.index}`);
      const body = await res.json();
      if(!res.ok) throw new Error(body.error || 'failed to fetch claim proof');
      const signer = await user.getSigner();
      const campaign = new window.ethers.Contract(c.id, CAMPAIGN_ABI, signer);
      const tx = await campaign.claim(e.index, body.amount, body.proof);
      notify('Claim submitted -- waiting for confirmation...');
      await tx.wait();
      notify(`Claimed epoch ${e.n}.`);
      setRefreshTick(t=>t+1);
    } catch(err){
      notify('Claim failed: '+shortError(err));
    } finally {
      setClaiming(null);
    }
  };

  return (
    <div className="page">
      <div className="wrap">
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / <button onClick={()=>go('/sso')}>SSO</button> / {c.token}</div>
