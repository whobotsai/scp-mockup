<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strong Commitment Protocol</title>
<style>
/* ============ FONTS ============ */
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ============ TOKENS ============ */
/* Brand field: Robinhood chartreuse (#D7FA4A family) is the dominant color, not just an accent.
   Light theme: the chartreuse IS the page field; white cards float on it; CTAs invert to ink-on-chartreuse.
   Dark theme: the field goes dark for legibility, but the same chartreuse stays the loud, unmistakable accent. */
:root{
  --bg:#D8FA4E;
  --surface:#FFFFFF;
  --surface-2:#F1F8DC;
  --border:#B7D65E;
  --text:#12160B;
  --text-dim:#48551F;
  --text-faint:#6E7C42;
  --accent:#6B9400;
  --accent-strong:#547600;
  --accent-soft:#EAF7BE;
  --accent-ink:#FFFFFF;
  --cta-bg:#12160B;
  --cta-ink:#E8FA9E;
  --sho:#A5741F;
  --sho-soft:#F1E3C8;
  --sso:#3E5C9A;
  --sso-soft:#DFE5F3;
  --danger:#A8452F;
  --danger-soft:#F3E0D9;
  --shadow: 0 1px 2px rgba(18,22,11,.08), 0 10px 26px -14px rgba(18,22,11,.28);
  --radius-s:4px;
  --radius-m:8px;
  --radius-l:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111409;
    --surface:#181D12;
    --surface-2:#1F2517;
    --border:#333D22;
    --text:#F1F6DE;
    --text-dim:#A3B383;
    --text-faint:#71805A;
    --accent:#C6F23E;
    --accent-strong:#DBFC6E;
    --accent-soft:#232C13;
    --accent-ink:#0C1005;
    --cta-bg:#C6F23E;
    --cta-ink:#0C1005;
    --sho:#DDB05C;
    --sho-soft:#332A17;
    --sso:#8CA6E0;
    --sso-soft:#1E273B;
    --danger:#E28568;
    --danger-soft:#3A241D;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 34px -16px rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111409;
  --surface:#181D12;
  --surface-2:#1F2517;
  --border:#333D22;
  --text:#F1F6DE;
  --text-dim:#A3B383;
  --text-faint:#71805A;
  --accent:#C6F23E;
  --accent-strong:#DBFC6E;
  --accent-soft:#232C13;
  --accent-ink:#0C1005;
  --cta-bg:#C6F23E;
  --cta-ink:#0C1005;
  --sho:#DDB05C;
  --sho-soft:#332A17;
  --sso:#8CA6E0;
  --sso-soft:#1E273B;
  --danger:#E28568;
  --danger-soft:#3A241D;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 34px -16px rgba(0,0,0,.65);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--border) 55%, transparent) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--text);
  font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,h4{
  font-family:'Big Shoulders','Arial Narrow',sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.01em;
  text-wrap:balance;
  margin:0;
  color:var(--text);
}
.mono, .num, code{
  font-family:'IBM Plex Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}

.wrap{max-width:1120px;margin:0 auto;padding:0 44px;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-dim);
}

/* ============ NAV ============ */
.topnav{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topnav-inner{
  max-width:1120px;margin:0 auto;padding:14px 44px;
  display:flex;align-items:center;gap:28px;
}
@media (max-width: 880px){ .topnav-inner{padding:14px 22px;} }
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;}
.brand-mark{
  width:26px;height:26px;border-radius:6px;
  background:var(--cta-bg);
  display:flex;align-items:center;justify-content:center;
  color:var(--cta-ink);font-family:'Big Shoulders';font-weight:800;font-size:15px;
  flex:none;
}
.brand-word{font-family:'Big Shoulders';font-weight:700;font-size:16.5px;letter-spacing:.005em;text-transform:uppercase;color:var(--text);white-space:nowrap;}
.nav-links{display:flex;gap:4px;flex:1;}
.nav-link{
  background:none;border:none;cursor:pointer;
  font-family:'IBM Plex Sans';font-size:13.5px;font-weight:500;
  color:var(--text-dim);padding:7px 12px;border-radius:6px;
  display:inline-flex;align-items:center;gap:6px;
}
.nav-link:hover{color:var(--text);background:var(--surface-2);}
.nav-link.active{color:var(--text);background:var(--surface-2);}
.nav-right{display:flex;align-items:center;gap:10px;}
.theme-toggle{
  background:none;border:1px solid var(--border);border-radius:7px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);cursor:pointer;
}
.theme-toggle:hover{color:var(--text);border-color:var(--text-faint);}
.nav-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent-soft);color:var(--accent);
  border:1px solid transparent;border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;
  font-family:inherit;cursor:pointer;transition:border-color .12s ease;
}
.nav-chip:hover{border-color:var(--accent);}
.nav-chip.active{border-color:var(--accent);}

/* ============ BUTTONS ============ */
.btn{
  font-family:'IBM Plex Sans';font-weight:600;font-size:13.5px;
  border-radius:7px;padding:9px 16px;border:1px solid transparent;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:filter .12s ease, background .12s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--cta-bg);color:var(--cta-ink);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--text);border-color:transparent;}
.btn-ghost:hover{background:rgba(0,0,0,.06);}
:root[data-theme="dark"] .btn-ghost:hover{background:rgba(255,255,255,.08);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-ghost:hover{background:rgba(255,255,255,.08);}}
.btn-outline{background:transparent;color:var(--cta-bg);border-color:var(--cta-bg);}
.btn-outline:hover{background:var(--surface);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{filter:none;}

/* ============ BADGES / TAGS ============ */
.tag{
  font-family:'IBM Plex Mono';font-size:11px;font-weight:500;letter-spacing:.03em;
  padding:3px 8px;border-radius:5px;display:inline-flex;align-items:center;gap:5px;text-transform:uppercase;
}
.tag-sho{background:var(--sho-soft);color:var(--sho);}
.tag-sso{background:var(--sso-soft);color:var(--sso);}
.tag-danger{background:var(--danger-soft);color:var(--danger);}
.tag-neutral{background:var(--surface-2);color:var(--text-dim);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}

/* ============ CARDS / SURFACES ============ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:22px;}

/* ============ LANDING ============ */
.hero{padding:72px 0 56px;position:relative;overflow:hidden;}
.hero-grid{position:relative;z-index:1;}
.hero > .stat-groups, .hero > .stats-note{position:relative;z-index:1;}

/* Settlement rail: the hero's signature visual. A single schematic ledger line
   showing the mechanism itself (lock -> milestone -> payout), not decoration. */
.rail-wrap{position:absolute;left:-2%;right:-2%;bottom:-6%;width:104%;aspect-ratio:1000/170;z-index:0;pointer-events:none;}
.rail-svg{width:100%;height:100%;display:block;overflow:visible;}
.rail-path{fill:none;stroke:color-mix(in srgb, var(--text) 16%, transparent);stroke-width:1.5;stroke-dasharray:2 7;stroke-linecap:round;}
.rail-node-ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:railPulse 3.2s ease-out infinite;}
.rail-node-dot{fill:var(--accent);}
.rail-pulse{fill:var(--accent);filter:drop-shadow(0 0 5px var(--accent));}
.rail-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;fill:var(--text-dim);text-transform:uppercase;}

@keyframes railPulse{0%{transform:scale(.7);opacity:.65;}100%{transform:scale(2.1);opacity:0;}}

@media (prefers-reduced-motion: reduce){
  .rail-node-ring{animation:none;opacity:.35;}
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
.hero h1{font-size:56px;line-height:.98;margin:14px 0 18px;}
.hero .lede{font-size:17px;color:var(--text-dim);max-width:46ch;margin-bottom:28px;}
.hero-ctas{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
.hero-ctas::-webkit-scrollbar{display:none;}
.hero-ctas .btn{flex:none;}

.vault{
  aspect-ratio:1/1;border-radius:50%;
  border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:var(--shadow);
}
.vault svg{width:100%;height:100%;position:relative;z-index:1;}
.vault-sweep{
  position:absolute;inset:6%;border-radius:50%;z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0%, var(--accent) 6%, transparent 22%);
  -webkit-mask:radial-gradient(circle, transparent 62%, #000 63%, #000 74%, transparent 75%);
  mask:radial-gradient(circle, transparent 62%, #000 63%, #000 74%, transparent 75%);
  animation:vaultSpin 5s linear infinite;
  opacity:.6;
}
@keyframes vaultSpin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){ .vault-sweep{animation:none;} }
.vault-center{position:absolute;z-index:2;text-align:center;max-width:60%;}
.vault-center .num{font-family:'Big Shoulders';font-size:34px;font-weight:800;color:var(--text);display:block;line-height:1;}
.vault-center .lbl{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.04em;color:var(--text-dim);text-transform:uppercase;display:block;margin-top:6px;line-height:1.4;}

.stat-groups{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:52px;}
.stat-group{border:1px solid var(--border);border-radius:var(--radius-l);background:var(--surface);overflow:hidden;}
.stat-group-head{display:flex;align-items:center;gap:7px;padding:12px 20px;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono';font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
.stat-group-head.sho{color:var(--sho);background:var(--sho-soft);}
.stat-group-head.sso{color:var(--sso);background:var(--sso-soft);}
.stat-group-body{display:grid;grid-template-columns:repeat(3,1fr);}
.stat-group-body .stat-tile{border-right:1px solid var(--border);}
.stat-group-body .stat-tile:last-child{border-right:none;}
.stat-tile{background:var(--surface);padding:18px 18px;display:grid;grid-template-columns:auto 1fr;column-gap:9px;row-gap:2px;align-items:start;}
.stat-tile svg{grid-row:1 / span 2;margin-top:3px;}
.stat-tile .num{font-family:'Big Shoulders';font-size:26px;font-weight:800;display:block;color:var(--text);}
.stat-tile .lbl{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.stats-note{font-size:11.5px;color:var(--text-faint);margin-top:10px;}
.live-dot{
  margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;
  animation:liveDotPulse 2s ease-out infinite;
}
@keyframes liveDotPulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);}
  100%{box-shadow:0 0 0 7px transparent;}
}
@media (prefers-reduced-motion: reduce){ .live-dot{animation:none;} }

/* ============ PROFILE ============ */
.profile-head{display:flex;align-items:center;gap:16px;margin:8px 0 26px;flex-wrap:wrap;}
.profile-avatar{
  width:52px;height:52px;border-radius:14px;flex:none;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.profile-stats .stat-tile{border:1px solid var(--border);border-radius:var(--radius-l);}
.profile-stats .stat-tile.accent{border-color:var(--accent);background:var(--accent-soft);}
.profile-stats .stat-tile.accent svg{color:var(--accent);}
.profile-stats .stat-tile.accent .num{color:var(--accent);}

.claim-list{display:flex;flex-direction:column;}
.claim-row{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 6px;border-bottom:1px solid var(--border);cursor:pointer;
}
.claim-row:last-child{border-bottom:none;}
.claim-row:hover{background:var(--surface-2);}

.created-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.created-card{
  border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;cursor:pointer;
  transition:border-color .12s ease;
}
.created-card:hover{border-color:var(--text-faint);}

.section{padding:64px 0;border-top:1px solid var(--border);}
.section-head{max-width:64ch;margin-bottom:36px;}
.section-head h2{font-size:32px;margin:8px 0 10px;}
.section-head p{color:var(--text-dim);font-size:15.5px;}
.hl{color:var(--accent);font-weight:700;}

.how-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
.how-col{padding:24px;border-radius:var(--radius-l);border:1px solid var(--border);background:var(--surface);}
.how-col-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.how-step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--border);}
.how-step:first-of-type{border-top:none;}
.how-step .n{font-family:'Big Shoulders';font-size:22px;font-weight:800;color:var(--text-faint);flex:none;width:28px;}
.how-step .t{font-weight:600;font-size:14px;margin-bottom:3px;}
.how-step .d{font-size:13.5px;color:var(--text-dim);}

.value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.value-card{padding:24px;border-radius:var(--radius-l);border:1px solid var(--border);background:var(--surface);}
.value-card .k{font-family:'IBM Plex Mono';font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:block;}
.value-card h3{font-size:20px;text-transform:none;margin-bottom:8px;}
.value-card p{font-size:13.5px;color:var(--text-dim);margin:0;}

.cta-band{
  border-radius:var(--radius-l);background:var(--cta-bg);
  padding:40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.cta-band h2{font-size:26px;color:var(--cta-ink);}
.cta-band p{color:var(--cta-ink);opacity:.72;margin:6px 0 0;font-size:14px;}
.cta-band .btn-primary{background:var(--accent);color:var(--accent-ink);}

.footer{border-top:1px solid var(--border);padding:28px 0;color:var(--text-faint);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

/* ============ APP SHELL ============ */
.page{flex:1;padding:36px 0 72px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
.page-head h1{font-size:34px;}
.breadcrumb{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-faint);margin-bottom:8px;}
.breadcrumb button{background:none;border:none;color:var(--text-dim);font-family:inherit;font-size:inherit;cursor:pointer;padding:0;}
.breadcrumb button:hover{color:var(--text);text-decoration:underline;}

.filter-row{display:flex;gap:8px;margin-bottom:22px;}
.pill-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:6px 14px;font-size:12.5px;font-weight:500;color:var(--text-dim);cursor:pointer;
}
.pill-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}

.pagination{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
  margin-top:28px;padding-top:20px;border-top:1px solid var(--border);
}
.pagination-count{font-size:12px;color:var(--text-dim);}
.pagination-nav{display:flex;align-items:center;gap:14px;}
.page-indicator{font-size:12px;color:var(--text-dim);}
.page-btn{
  display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);
  border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;
  transition:border-color .12s ease, color .12s ease;
}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.page-btn:disabled{color:var(--text-faint);cursor:not-allowed;opacity:.5;}
.camp-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);
  padding:20px;cursor:pointer;transition:border-color .12s ease, transform .12s ease;
  display:flex;flex-direction:column;gap:14px;
}
.camp-card:hover{border-color:var(--text-faint);transform:translateY(-2px);}
.camp-card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.ticker{font-family:'Big Shoulders';font-size:24px;font-weight:800;}
.camp-meta{font-size:12px;color:var(--text-dim);}
.camp-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);}
.camp-row b{color:var(--text);font-weight:600;}

.meter-track{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative;}
.meter-fill{height:100%;background:var(--accent);border-radius:5px;}
.meter-ticks{display:flex;justify-content:space-between;margin-top:6px;}
.meter-tick{font-family:'IBM Plex Mono';font-size:10px;color:var(--text-faint);}
.meter-tick.done{color:var(--sho);}

.detail-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:stretch;}
.milestone-list{display:flex;flex-direction:column;gap:10px;}
.milestone-row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-m);
  border:1px solid var(--border);background:var(--surface);
}
.milestone-row.reached{background:var(--accent-soft);border-color:var(--accent);}
.milestone-row.claimable{background:var(--accent-soft);border-color:var(--accent);}
.ms-icon{
  width:30px;height:30px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--border);font-family:'IBM Plex Mono';font-size:12px;color:var(--text-faint);
}
.milestone-row.reached .ms-icon, .milestone-row.claimable .ms-icon{border-color:var(--accent);color:var(--accent);}
.ms-body{flex:1;}
.ms-title{font-weight:600;font-size:14px;}
.ms-sub{font-size:12px;color:var(--text-dim);margin-top:1px;}

table{width:100%;border-collapse:collapse;}
.lb-table th{
  text-align:left;font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-faint);font-weight:500;padding:0 12px 10px;border-bottom:1px solid var(--border);
}
.lb-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;}
.lb-table tr:last-child td{border-bottom:none;}
.lb-table .rank{font-family:'Big Shoulders';font-weight:700;font-size:15px;color:var(--text-faint);width:32px;}
.lb-table tr.me td{background:var(--accent-soft);}
.lb-table tr.me .rank{color:var(--accent);}
.addr{color:var(--text-dim);}
.bar-cell{width:120px;}
.mini-bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
.mini-bar > div{height:100%;background:var(--accent);}
.scroll-x{overflow-x:auto;}

.side-stack{display:flex;flex-direction:column;gap:16px;height:100%;}
.side-stack > .panel:last-child{flex:1;}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-dim);display:inline-flex;align-items:center;gap:5px;}
.kv .v{font-weight:600;font-family:'IBM Plex Mono';font-size:12.5px;}
.token-mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'Big Shoulders';font-weight:800;font-size:16px;text-transform:uppercase;
}

.you-card{border:1px dashed var(--border);border-radius:var(--radius-m);padding:16px;background:var(--surface-2);}
.you-empty{font-size:13px;color:var(--text-dim);}

/* ============ FORMS / WIZARD ============ */
.wizard{display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start;}
.steps{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;}
.step-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;
  font-size:13px;color:var(--text-faint);
}
.step-item .idx{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:10px;flex:none;
}
.step-item.done{color:var(--text-dim);}
.step-item.done .idx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.step-item.current{color:var(--text);font-weight:600;background:var(--surface-2);}
.step-item.current .idx{border-color:var(--accent);color:var(--accent);}

.field{margin-bottom:20px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--text);}
.field .help{font-size:12px;color:var(--text-dim);margin-top:6px;}
.token-resolved{
  display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 12px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500;
}
.token-resolved.bad{background:var(--danger-soft);color:var(--danger);}
input[type=text],input[type=number]{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;
  padding:10px 12px;font-family:'IBM Plex Mono';font-size:13.5px;color:var(--text);
}
input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 15px;
  font-family:'IBM Plex Mono';font-size:12.5px;color:var(--text-dim);cursor:pointer;
}
.opt-btn.sel{background:var(--text);color:var(--bg);border-color:var(--text);}
.milestone-picker{display:flex;flex-direction:column;gap:10px;}
.ms-pick-row{
  display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:var(--radius-m);padding:12px 14px;
}
.ms-pick-row.on{border-color:var(--accent);background:var(--accent-soft);}
.ms-pick-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
.ms-pick-row .label{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;flex:1;}
.ms-pick-row .bps{width:90px;}
.bps-warn{font-size:12px;color:var(--danger);margin-top:8px;}
.bps-ok{font-size:12px;color:var(--sho);margin-top:8px;}

.summary-list{display:flex;flex-direction:column;}
.wizard-actions{display:flex;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);}

.empty-state{text-align:center;padding:64px 24px;color:var(--text-dim);}
.empty-state h3{color:var(--text);font-size:20px;margin-bottom:8px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:8px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow);z-index:100;
  display:flex;align-items:center;gap:10px;
}

@media (max-width: 880px){
  .wrap{padding:0 22px;}
  .hero-grid{grid-template-columns:1fr;}
  .hero h1{font-size:40px;}
  .detail-grid{grid-template-columns:1fr;}
  .wizard{grid-template-columns:1fr;}
  .steps{position:static;flex-direction:row;overflow-x:auto;}
  .grid-3, .how-grid, .value-grid{grid-template-columns:1fr;}
  .stat-groups{grid-template-columns:1fr;}
  .stat-group-body{grid-template-columns:1fr;}
  .stat-group-body .stat-tile{border-right:none;border-top:1px solid var(--border);}
  .stat-group-body .stat-tile:first-child{border-top:none;}
  .nav-links{display:none;}
  .profile-stats{grid-template-columns:1fr 1fr;}
  .created-grid{grid-template-columns:1fr;}
}
</style>

function leaderboard(seedBase, n, scoreLabel){
  return Array.from({length:n}, (_,i)=>{
    const val = Math.round((n-i)*1000*seededShare(seedBase+i)*(1+ (n-i)/n));
    return {
      rank:i+1,
      who: scoreLabel==='volume' ? WALLETS[i%WALLETS.length] : XHANDLES[i%XHANDLES.length],
      value: val,
    };
  });
}

function fmtNum(n){
  if(n>=1000000) return (n/1000000).toFixed(2).replace(/\.00$/,'')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'K';
  return String(n);
}
function fmtUSD(n){ return '$'+fmtNum(n); }
function pctToNext(mcap, tiers){
  const next = tiers.find(t=>t.value>mcap) || tiers[tiers.length-1];
  const prevIdx = tiers.indexOf(next)-1;
  const prev = prevIdx>=0 ? tiers[prevIdx].value : 0;
  const pct = Math.max(0,Math.min(100, ((mcap-prev)/(next.value-prev))*100));
  return {next, pct};
}

    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);
  const go = useCallback((r)=>{ window.location.hash = r; }, []);
  return [route, go];
}

// Tweens 0 -> target on mount with an ease-out curve; snaps instantly for reduced-motion.
function useCountUp(target, duration=1200){
  const [val, setVal] = useState(0);
  useEffect(()=>{
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ setVal(target); return; }
    let raf, start;
    const tick = (t)=>{
      if(start===undefined) start = t;
      const p = Math.min(1, (t-start)/duration);
      setVal(target*(1-Math.pow(1-p,3)));
      if(p<1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

function VaultDial(){
  const pct = useCountUp(62, 1400);
  const amount = useCountUp(2.44, 1400);
  const r = 42, c = 2*Math.PI*r;

      <svg viewBox="0 0 100 100">

        {MS_TIERS.map((t,i)=>{
          const ang = -90 + (i/(MS_TIERS.length-1))*270;

const PAGE_SIZE = 6;

function Discover({kind, go}){
  const isSHO = kind==='sho';
  const fullList = isSHO ? SHO_CAMPAIGNS : SSO_CAMPAIGNS;
  const [filter,setFilter] = useState('all');
  const [page,setPage] = useState(0);

  useEffect(()=>{ setPage(0); }, [kind, filter]);

  const list = useMemo(()=>{
    if(filter==='active') return fullList.filter(hasActiveTier);
    if(filter==='new') return fullList.filter(c=>c.openedDaysAgo<=NEW_THRESHOLD_DAYS);
    return fullList;
  }, [fullList, filter]);

  const pageCount = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const clampedPage = Math.min(page, pageCount-1);
  const pageItems = list.slice(clampedPage*PAGE_SIZE, clampedPage*PAGE_SIZE + PAGE_SIZE);
  const fromN = list.length===0 ? 0 : clampedPage*PAGE_SIZE + 1;
  const toN = Math.min(list.length, clampedPage*PAGE_SIZE + PAGE_SIZE);

  return (
    <div className="page">
      <div className="wrap">
        <div className="page-head">
          <div>
            <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / {isSHO?'SHO':'SSO'}</div>
            <h1>{isSHO?'Strong Hold Offering':'Strong Shill Offering'}</h1>
          </div>
          <Btn icon={IcoPlus} onClick={()=>go(`/${kind}/create`)}>New campaign</Btn>
        </div>
        <div className="filter-row">
          {['all','active','new'].map(f=>(
            <button key={f} className={`pill-btn ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f==='all'?'All campaigns':f==='active'?'Milestone active':'Recently opened'}</button>
          ))}
        </div>
        {list.length===0 ? (
          <div className="empty-state">
            <h3>No campaigns match this filter</h3>
            <p>{filter==='active' ? "None of the current campaigns have a live milestone right now." : "Nothing opened in the last "+NEW_THRESHOLD_DAYS+" days."} Try &ldquo;All campaigns&rdquo; instead.</p>
          </div>
        ) : (
          <>
            <div className="grid-3">
              {pageItems.map(c=> <CampaignCard key={c.id} c={c} kind={kind} onOpen={()=>go(`/${kind}/${c.id}`)}/> )}
            </div>
            <div className="pagination">
              <span className="pagination-count mono">{fromN}&ndash;{toN} of {list.length}</span>
              <div className="pagination-nav">
                <button className="page-btn" disabled={clampedPage===0} onClick={()=>setPage(p=>Math.max(0,p-1))}><IcoArrowRight size={14} style={{transform:'rotate(180deg)'}}/>Previous</button>
                <span className="page-indicator mono">Page {clampedPage+1} of {pageCount}</span>
                <button className="page-btn" disabled={clampedPage>=pageCount-1} onClick={()=>setPage(p=>Math.min(pageCount-1,p+1))}>Next<IcoArrowRight size={14}/></button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function SHODetail({id, go, user, notify}){
  const c = SHO_CAMPAIGNS.find(x=>x.id===id);
  const [claimed,setClaimed] = useState({});
  const board = useMemo(()=> c ? leaderboard(id.length, c.size>50?50:c.size, 'volume') : [], [id, c]);
  if(!c) return <EmptyRoute go={go}/>;
  const tiers = campaignTiers(c);
  const {next, pct} = pctToNext(c.mcap, tiers);
  const allTiersReached = c.mcap >= tiers[tiers.length-1].value;
  const profile = TOKEN_REGISTRY[c.contract];
  const myPos = MY_SHO_POSITIONS.find(p=>p.campaignId===c.id);

  const doClaim = (tier)=>{
    if(!user.wallet){ notify('Connect a wallet first to claim.'); return; }
    if(!(myPos && myPos.claimable)){ notify("You're not eligible for this tier — only leaderboard-ranked wallets can claim."); return; }
    setClaimed(p=>({...p,[tier]:true}));
    notify(`Claim submitted for the ${tier} tier (mock).`);
  };

  return (
    <div className="page">
      <div className="wrap">
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / <button onClick={()=>go('/sho')}>SHO</button> / {c.token}</div>
        <div className="page-head">
          <div>
            <h1>{c.token} <span style={{color:'var(--text-faint)'}}>&middot; SHO</span></h1>
            <div className="camp-meta">Opened by {c.creatorType} {c.creator} &middot; {c.window} window &middot; Top {c.size} &middot; {c.duration} duration</div>
          </div>
          <Tag kind="sho">Active</Tag>
        </div>

        <div className="detail-grid">
          <div className="side-stack">
            <div className="panel">
              <div className="eyebrow" style={{marginBottom:10,display:'flex',alignItems:'center',gap:6}}><IcoTarget size={13}/>Milestone progress</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}>
                <span className="mono" style={{fontSize:22,fontWeight:600}}>{fmtUSD(c.mcap)}</span>
                <span className="camp-meta">{allTiersReached ? 'all funded tiers reached' : `next: ${next.label}`}</span>
              </div>
              <Meter pct={pct}/>
              <div className="milestone-list" style={{marginTop:20}}>
                {c.milestones.map(m=>(
                  <div key={m.tier} className={`milestone-row ${m.status==='claimed'?'reached':m.status==='claimable'?'claimable':m.status==='active'?'reached':''}`}>
                    <div className="ms-icon"><MsIcon status={m.status}/></div>
                    <div className="ms-body">
                      <div className="ms-title">{m.tier} mcap &middot; {m.bps/100}% of pool</div>
                      <div className="ms-sub">
                        {m.status==='pending' && 'Not yet reached'}
                        {m.status==='active' && 'Currently the closest tier to being reached'}
                        {m.status==='claimed' && (claimed[m.tier] ? 'You claimed this tier' : 'Reached &middot; distributed to top traders')}
                        {m.status==='claimable' && 'Challenge window cleared &middot; claim open'}
                      </div>
                    </div>
                    {m.status==='claimable' && !claimed[m.tier] && (
                      (!user.wallet || (myPos && myPos.claimable))
                        ? <Btn size="sm" icon={IcoCheckCirc} onClick={()=>doClaim(m.tier)}>Claim</Btn>
                        : <Tag kind="neutral">Not eligible</Tag>
                    )}
                    {m.status==='claimable' && claimed[m.tier] && <Tag kind="sho" icon={IcoCheckCirc}>Claimed</Tag>}
                  </div>
                ))}
              </div>
            </div>

            <div className="panel">
              <div className="eyebrow" style={{marginBottom:14,display:'flex',alignItems:'center',gap:6}}><IcoTrophy size={13}/>Leaderboard &middot; {c.window} net-buy volume</div>
              <div className="scroll-x">
                <table className="lb-table">
                  <thead><tr><th>#</th><th>Wallet</th><th>Net-buy volume</th><th>Share</th></tr></thead>
                  <tbody>
                    {board.slice(0,10).map((r,i)=>{
                      const isMe = !!(myPos && user.wallet && r.rank===myPos.rank);
                      return (
                        <tr key={i} className={isMe ? 'me':''}>
                          <td className="rank">{r.rank}</td>
                          <td className="addr mono">{isMe ? user.wallet : r.who}</td>
                          <td className="mono">${fmtNum(isMe ? myPos.volume : r.value)}</td>
                          <td className="bar-cell"><div className="mini-bar"><div style={{width:(100-i*8)+'%'}}></div></div></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                {myPos && user.wallet && myPos.rank>10 &&
                  <div className="camp-meta" style={{marginTop:10}}>Your rank: #{myPos.rank} &middot; ${fmtNum(myPos.volume)} net-buy volume (outside top 10 shown above)</div>}
              </div>
            </div>
          </div>

          <div className="side-stack">
            <div className="panel">
              <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoCoins size={13}/>Token profile</div>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
                <div className="token-mark">{c.token.replace('$','').slice(0,1)}</div>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>{profile ? profile.name : c.name}</div>
                  <div className="mono" style={{fontSize:12,color:'var(--text-dim)'}}>{c.token}</div>
                </div>
              </div>
              <div className="kv"><span className="k"><IcoGlobe size={13}/> Website</span><span className="v">{profile ? profile.website : '—'}</span></div>
              <div className="kv"><span className="k"><IcoX size={13}/> Twitter / X</span><span className="v">{profile ? profile.twitter : '—'}</span></div>
              <div className="kv"><span className="k">Current mcap</span><span className="v">{fmtUSD(c.mcap)}</span></div>
              <div className="kv"><span className="k">ATH mcap</span><span className="v">{profile ? fmtUSD(profile.ath) : '—'}</span></div>
              <div className="kv"><span className="k"><IcoUsers size={13}/> Holders</span><span className="v">{profile ? profile.holders.toLocaleString() : '—'}</span></div>
              <div className="kv"><span className="k">Contract</span><span className="v mono" style={{fontSize:11}}>{c.contract.slice(0,6)}...{c.contract.slice(-4)}</span></div>
            </div>

            <div className="panel">
              <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoWallet size={13}/>Your position</div>
              {user.wallet ? (
                myPos ? (
                  <div className="you-card">
                    <div className="kv"><span className="k">Wallet</span><span className="v">{user.wallet}</span></div>
                    <div className="kv"><span className="k">Rank this window</span><span className="v">#{myPos.rank}</span></div>
                    <div className="kv"><span className="k">Net-buy volume</span><span className="v">{fmtUSD(myPos.volume)}</span></div>
                    <div className="kv"><span className="k">Claimable now</span><span className="v">{myPos.claimable ? `${fmtNum(myPos.claimAmount)} ${c.denom}` : '—'}</span></div>
                  </div>
                ) : (
                  <div className="you-card">
                    <div className="you-empty">You haven't traded {c.token} yet &mdash; buy in this window to appear on the leaderboard.</div>
                  </div>
                )
              ) : (
                <div className="you-card">
                  <div className="you-empty">Connect a wallet to see your live rank and claimable rewards.</div>
                  <div style={{marginTop:12}}><Btn size="sm" icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn></div>
                </div>
              )}
            </div>
            <div className="panel">
              <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoInfo size={13}/>Campaign details</div>
              <div className="kv"><span className="k">Total locked</span><span className="v">{fmtNum(c.locked)} {c.token}</span></div>
              <div className="kv"><span className="k">Reward denomination</span><span className="v">{c.denom}</span></div>
              <div className="kv"><span className="k">Leaderboard window</span><span className="v">{c.window}</span></div>
              <div className="kv"><span className="k">Leaderboard size</span><span className="v">Top {c.size}</span></div>
              <div className="kv"><span className="k">Campaign duration</span><span className="v">{c.duration}</span></div>
              <div className="kv"><span className="k">Time remaining</span><span className="v">{c.daysLeft}d</span></div>
              <div className="kv"><span className="k">Protocol fee</span><span className="v">0.5% (taken at open)</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===================== SSO DETAIL ===================== */

function SSODetail({id, go, user, notify}){
  const c = SSO_CAMPAIGNS.find(x=>x.id===id);
  const [claimed,setClaimed] = useState({});
  const board = useMemo(()=> c ? leaderboard(id.length+3, c.size>50?50:c.size, 'engagement') : [], [id, c]);
  if(!c) return <EmptyRoute go={go}/>;
  const activeEpoch = c.epochs.find(e=>e.status==='active');
  const epochLabel = activeEpoch ? `Epoch ${activeEpoch.n} of ${c.epochs.length}`
    : c.epochs.every(e=>e.status==='pending') ? 'Not started yet' : 'Between epochs';
  const profile = TOKEN_REGISTRY[c.contract];
  const myPos = MY_SSO_POSITIONS.find(p=>p.campaignId===c.id);
  const doClaim = (n)=>{
    if(!user.xhandle){ notify('Register your X account first to claim.'); return; }
    if(!(myPos && myPos.claimable)){ notify("You're not eligible for this epoch — only leaderboard-ranked accounts can claim."); return; }
    setClaimed(p=>({...p,[n]:true}));
    notify(`Claim submitted for epoch ${n} (mock).`);

    <div className="page">

/* ===================== CREATE WIZARD (SHO / SSO) ===================== */

const SHO_STEPS = ['Token & amount','Reward & ranking','Duration','Milestones','Review'];
const SSO_STEPS = ['Token & amount','Reward & keyword','Epoch & size','Duration & split','Review'];

function CreateWizard({kind, go, user, notify}){
  const isSHO = kind==='sho';
  const steps = isSHO ? SHO_STEPS : SSO_STEPS;
  const [step,setStep] = useState(0);
  const [form,setForm] = useState({
    contract:'', token:'',
    amount:'10000000', denom:'token', window:'7D', size:100,
    duration:'30D', keyword:'$MYTOKEN', epochLen:'7D',
    ms: {'100K':2000,'250K':3000,'1M':2500,'5M':2500},
    msOn: {'100K':true,'250K':true,'1M':true,'5M':true},
  });
  const set = (k,v)=> setForm(f=>({...f,[k]:v}));
  const resolved = resolveToken(form.contract);

  useEffect(()=>{
    if(resolved) setForm(f=> f.token===resolved.ticker ? f : {...f, token:resolved.ticker});
  }, [resolved]);

  if(!user.wallet){
    return (
      <div className="page">
        <div className="wrap" style={{maxWidth:520}}>
          <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / <button onClick={()=>go(`/${kind}`)}>{isSHO?'SHO':'SSO'}</button> / New</div>
          <div className="empty-state">
            <h3>Connect a wallet to create a campaign</h3>
            <p>The connected wallet becomes the on-chain creator of record and locks the reward pool, so it has to be set before you can configure a campaign.</p>
            <div style={{marginTop:16}}><Btn icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn></div>
          </div>
        </div>
      </div>
    );
  }

  const totalBps = MS_TIERS.reduce((s,t)=> s + (form.msOn[t.id] ? Number(form.ms[t.id]||0) : 0), 0);
  const bpsOk = totalBps===10000;

  const next = ()=> setStep(s=>Math.min(steps.length-1,s+1));
  const back = ()=> setStep(s=>Math.max(0,s-1));

  const submit = ()=>{
    const denomLabel = form.denom==='token' ? form.token : form.denom.toUpperCase();
    const netLocked = Math.round(Number(form.amount||0)*0.995);
    const slug = (resolved?resolved.ticker:form.token).replace(/[^a-z0-9]/gi,'').toLowerCase() || 'token';
    const newId = `${slug}-${kind}-${Date.now().toString(36).slice(-5)}`;
    const base = {
      id:newId, token:form.token, name: resolved ? resolved.name : form.token.replace('$',''),
      creator:user.wallet, creatorType:'Dev', contract:form.contract,
      locked:netLocked, denom:denomLabel, size:form.size, duration:form.duration, openedDaysAgo:0,
    };
    if(isSHO){
      const chosenTiers = MS_TIERS.filter(t=>form.msOn[t.id]);
      SHO_CAMPAIGNS.push({
        ...base, window:form.window, daysLeft:Number(form.duration.replace('D','')),
        mcap: resolved ? resolved.mcap : 0,
        milestones: chosenTiers.map(t=>({tier:t.id, bps:form.ms[t.id], status:'pending'})),
      });
      MY_CREATED_SHO.push(newId);
    } else {
      const durDays = form.duration==='7D'?7:form.duration==='30D'?30:90;
      const epochDays = form.epochLen==='24H'?1:form.epochLen==='7D'?7:30;
      const epochCount = Math.max(1, Math.round(durDays/epochDays));
      SSO_CAMPAIGNS.push({
        ...base, keyword:form.keyword, epochLen:form.epochLen,
        epochs: Array.from({length:epochCount}, (_,i)=>({n:i+1, status:'pending'})),
      });
      MY_CREATED_SSO.push(newId);
    }
    notify(`${form.token} ${isSHO?'SHO':'SSO'} campaign created (mock), 0.5% fee deducted.`);
    go(`/${kind}/${newId}`);
  };

  return (
    <div className="page">
      <div className="wrap">
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / <button onClick={()=>go(`/${kind}`)}>{isSHO?'SHO':'SSO'}</button> / New</div>
        <div className="page-head"><h1>New {isSHO?'Strong Hold':'Strong Shill'} Offering</h1></div>

        <div className="wizard">
          <div className="steps">
            {steps.map((s,i)=>(
              <div key={s} className={`step-item ${i<step?'done':''} ${i===step?'current':''}`}>
                <span className="idx">{i<step?<IcoCheckCirc size={11} sw={2.2}/>:i+1}</span>{s}
              </div>
            ))}
          </div>

          <div className="panel">
            {step===0 && (
              <>
                <div className="field">
                  <label>Reward token &mdash; contract address</label>
                  <input type="text" className="mono" value={form.contract} onChange={e=>set('contract',e.target.value)} placeholder="0x..."/>
                  {form.contract.trim()==='' ? null : resolved ? (
                    <div className="token-resolved">
                      <IcoCheckCirc size={14}/> Resolved <b>{resolved.name}</b> <span className="mono">{resolved.ticker}</span>
                    </div>
                  ) : (
                    <div className="token-resolved bad">
                      <IcoInfo size={14}/> Contract not recognized on Robinhood Chain &mdash; check the address.
                    </div>
                  )}
                  <div className="help">Added by contract, never by typing a ticker &mdash; the ticker above is resolved automatically. Must be indexed from Pons.family (bonding curve or graduated to Uniswap V4).</div>
                </div>
                <div className="field">
                  <label>Amount to lock</label>
                  <input type="text" value={form.amount} onChange={e=>set('amount',e.target.value)}/>
                  <div className="help">0.5% protocol fee deducted at creation &middot; net escrowed: {fmtNum(Math.round(Number(form.amount||0)*0.995))} {form.token}</div>
                </div>
              </>
            )}

            {step===1 && isSHO && (
              <>
                <div className="field">
                  <label>Reward denomination</label>
                  <div className="opt-row">
                    {[['token', form.token],['usdc','USDC'],['eth','ETH']].map(([v,l])=>(
                      <button key={v} className={`opt-btn ${form.denom===v?'sel':''}`} onClick={()=>set('denom',v)}>{l}</button>
                    ))}
                  </div>
                </div>
                <div className="field">
                  <label>Leaderboard window</label>
                  <div className="opt-row">
                    {['24H','7D','30D'].map(v=>(
                      <button key={v} className={`opt-btn ${form.window===v?'sel':''}`} onClick={()=>set('window',v)}>{v}</button>
                    ))}
                  </div>
                </div>
                <div className="field">
                  <label>Leaderboard size</label>
                  <div className="opt-row">
                    {[50,100,500].map(v=>(
                      <button key={v} className={`opt-btn ${form.size===v?'sel':''}`} onClick={()=>set('size',v)}>Top {v}</button>
                    ))}
                  </div>
                </div>
              </>
            )}

            {step===1 && !isSHO && (
              <>
                <div className="field">
                  <label>Reward denomination</label>
                  <div className="opt-row">
                    {[['token', form.token],['usdc','USDC'],['eth','ETH']].map(([v,l])=>(
                      <button key={v} className={`opt-btn ${form.denom===v?'sel':''}`} onClick={()=>set('denom',v)}>{l}</button>
                    ))}
                  </div>
                </div>
                <div className="field">
                  <label>Tracked keyword</label>
                  <input type="text" value={form.keyword} onChange={e=>set('keyword',e.target.value)}/>
                  <div className="help">A hashtag, cashtag, or phrase. Set once, immutable after creation.</div>
                </div>
              </>
            )}

            {step===2 && isSHO && (
              <div className="field">
                <label>Campaign duration</label>
                <div className="opt-row">
                  {['7D','30D','90D'].map(v=>(
                    <button key={v} className={`opt-btn ${form.duration===v?'sel':''}`} onClick={()=>set('duration',v)}>{v}</button>
                  ))}
                </div>
                <div className="help">Deadline for all milestones to be reached. Whatever's unreached locks forever.</div>
              </div>
            )}

            {step===2 && !isSHO && (
              <>
                <div className="field">
                  <label>Epoch length</label>
                  <div className="opt-row">
                    {['24H','7D','30D'].map(v=>(
                      <button key={v} className={`opt-btn ${form.epochLen===v?'sel':''}`} onClick={()=>set('epochLen',v)}>{v}</button>
                    ))}
                  </div>
                </div>
                <div className="field">
                  <label>Leaderboard size (per epoch)</label>
                  <div className="opt-row">
                    {[50,100,500].map(v=>(
                      <button key={v} className={`opt-btn ${form.size===v?'sel':''}`} onClick={()=>set('size',v)}>Top {v}</button>
                    ))}
                  </div>
                </div>
              </>
            )}

            {step===3 && isSHO && (
              <>
                <div className="field">
                  <label>Milestones &amp; pool split</label>
                  <div className="milestone-picker">
                    {MS_TIERS.map(t=>(
                      <div key={t.id} className={`ms-pick-row ${form.msOn[t.id]?'on':''}`}>
                        <input type="checkbox" checked={form.msOn[t.id]} onChange={e=>set('msOn',{...form.msOn,[t.id]:e.target.checked})}/>
                        <span className="label">{t.label} mcap</span>
                        <input className="bps" type="number" min="0" max="100" value={(form.ms[t.id]||0)/100}
                          onChange={e=>set('ms',{...form.ms,[t.id]: Math.round(Number(e.target.value||0)*100)})}
                          disabled={!form.msOn[t.id]} />
                        <span className="camp-meta">%</span>
                      </div>
                    ))}
                  </div>
                  {bpsOk ? <div className="bps-ok">&#10003; Allocations sum to 100%</div> : <div className="bps-warn">Allocations must sum to exactly 100% (currently {totalBps/100}%)</div>}
                </div>
              </>
            )}

            {step===3 && !isSHO && (
              <div className="field">
                <label>Campaign duration</label>
                <div className="opt-row">
                  {['7D','30D','90D'].map(v=>(
                    <button key={v} className={`opt-btn ${form.duration===v?'sel':''}`} onClick={()=>set('duration',v)}>{v}</button>
                  ))}
                </div>
                <div className="help">With a {form.epochLen} epoch, that's roughly {Math.max(1,Math.round((form.duration==='7D'?7:form.duration==='30D'?30:90)/(form.epochLen==='24H'?1:form.epochLen==='7D'?7:30)))} epochs, pool split evenly by default.</div>
              </div>
            )}

            {step===4 && (
              <div>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoCheckCirc size={13}/>Review &amp; confirm</div>
                <div className="kv"><span className="k">Token</span><span className="v">{resolved ? resolved.name : '—'} ({form.token})</span></div>
                <div className="kv"><span className="k">Contract</span><span className="v mono" style={{fontSize:11}}>{form.contract.slice(0,6)}...{form.contract.slice(-4)}</span></div>
                <div className="kv"><span className="k">Locked amount</span><span className="v">{fmtNum(Number(form.amount||0))} {form.token}</span></div>
                <div className="kv"><span className="k">Protocol fee (0.5%)</span><span className="v">&minus;{fmtNum(Math.round(Number(form.amount||0)*0.005))} {form.token}</span></div>
                <div className="kv"><span className="k">Net escrowed</span><span className="v">{fmtNum(Math.round(Number(form.amount||0)*0.995))} {form.token}</span></div>
                <div className="kv"><span className="k">Reward denomination</span><span className="v">{form.denom==='token'?form.token:form.denom.toUpperCase()}</span></div>
                {isSHO ? (
                  <>
                    <div className="kv"><span className="k">Leaderboard</span><span className="v">Top {form.size} &middot; {form.window} window</span></div>
                    <div className="kv"><span className="k">Duration</span><span className="v">{form.duration}</span></div>
                    <div className="kv"><span className="k">Milestones</span><span className="v">{MS_TIERS.filter(t=>form.msOn[t.id]).map(t=>t.label).join(', ')}</span></div>
                  </>
                ) : (
                  <>
                    <div className="kv"><span className="k">Keyword</span><span className="v">{form.keyword}</span></div>
                    <div className="kv"><span className="k">Epoch</span><span className="v">{form.epochLen} &middot; Top {form.size}</span></div>
                    <div className="kv"><span className="k">Duration</span><span className="v">{form.duration}</span></div>
                  </>
                )}
                <div className="help" style={{marginTop:16}}>Campaigns are immutable once created &middot; unreached milestones lock permanently, with no way to reclaim them.</div>
              </div>
            )}

            <div className="wizard-actions">
              <Btn kind="ghost" onClick={back} disabled={step===0}>Back</Btn>
              {step<steps.length-1
                ? <Btn onClick={next} disabled={(step===0 && !resolved) || (isSHO && step===3 && !bpsOk)}>Continue</Btn>
                : <Btn onClick={submit}>Create campaign</Btn>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===================== REGISTER (SSO) ===================== */

function Register({go, user, notify}){
  return (
    <div className="page">
      <div className="wrap" style={{maxWidth:520}}>
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / Register</div>
        <h1 style={{marginBottom:8}}>Link your X account</h1>
        <p className="camp-meta" style={{marginBottom:28}}>One registration covers every Strong Shill Offering campaign you ever participate in.</p>
        <div className="panel">
          <div className="field">
            <label>1. Connect wallet</label>
            {user.wallet ? <Tag kind="sho" icon={IcoCheckCirc}>{user.wallet} connected</Tag> : <Btn kind="outline" icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn>}
          </div>
          <div className="field">
            <label>2. Connect X account</label>
            {user.xhandle ? <Tag kind="sso" icon={IcoCheckCirc}>{user.xhandle} connected</Tag> : <Btn kind="outline" icon={IcoX} onClick={user.connectX} disabled={!user.wallet}>Connect X (OAuth)</Btn>}
            {!user.wallet && <div className="help">Connect a wallet first.</div>}
          </div>
          <Btn block icon={IcoShield} disabled={!user.wallet || !user.xhandle} onClick={()=>{notify('X account linked to wallet (mock).'); go('/sso');}}>Finish registration</Btn>
        </div>
      </div>
    </div>
  );
}

/* ===================== PROFILE ===================== */

function Profile({go, user, notify}){
  const hasWallet = !!user.wallet;
  const hasX = !!user.xhandle;
  const connected = hasWallet || hasX;

  const shoPositions = hasWallet ? MY_SHO_POSITIONS.map(p=>({...p, c:SHO_CAMPAIGNS.find(x=>x.id===p.campaignId)})).filter(p=>p.c) : [];
  const ssoPositions = hasX ? MY_SSO_POSITIONS.map(p=>({...p, c:SSO_CAMPAIGNS.find(x=>x.id===p.campaignId)})).filter(p=>p.c) : [];
  const createdSho = hasWallet ? MY_CREATED_SHO.map(id=>SHO_CAMPAIGNS.find(x=>x.id===id)).filter(Boolean) : [];
  const createdSso = hasWallet ? MY_CREATED_SSO.map(id=>SSO_CAMPAIGNS.find(x=>x.id===id)).filter(Boolean) : [];
  const history = connected ? CLAIM_HISTORY : [];

  const claimable = [
    ...shoPositions.filter(p=>p.claimable).map(p=>({kind:'sho', label:p.c.token, sub:'SHO leaderboard reward', amount:p.claimAmount, denom:p.c.denom, usd:p.claimUsd, open:()=>go(`/sho/${p.c.id}`)})),
    ...ssoPositions.filter(p=>p.claimable).map(p=>({kind:'sso', label:p.c.token, sub:'SSO leaderboard reward', amount:p.claimAmount, denom:p.c.denom, usd:p.claimUsd, open:()=>go(`/sso/${p.c.id}`)})),
  ];

  const totalClaimedUsd = history.reduce((s,h)=>s+h.usd,0);
  const totalClaimableUsd = claimable.reduce((s,it)=>s+it.usd,0);
  const activeCount = shoPositions.length + ssoPositions.length;
  const createdCount = createdSho.length + createdSso.length;

  const roles = [];
  if(shoPositions.length) roles.push({label:'Trader', kind:'sho'});
  if(ssoPositions.length) roles.push({label:'Shiller', kind:'sso'});
  if(createdCount) roles.push({label:'Creator', kind:'neutral'});

  return (
    <div className="page">
      <div className="wrap" style={{maxWidth:980}}>
        <div className="breadcrumb"><button onClick={()=>go('/')}>Strong Commitment Protocol</button> / Profile</div>

        <div className="profile-head">
          <div className="profile-avatar"><IcoWallet size={22}/></div>
          <div style={{flex:1,minWidth:220}}>
            <h1 style={{fontSize:26,marginBottom:6}}>{hasWallet ? user.wallet : hasX ? user.xhandle : 'Your profile'}</h1>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
              {hasWallet && hasX && <span className="camp-meta">{user.xhandle}</span>}
              {roles.map(r=> <Tag key={r.label} kind={r.kind}>{r.label}</Tag>)}
            </div>
          </div>
          {!hasWallet && <Btn size="sm" icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn>}
          {!hasX && <Btn kind="outline" size="sm" icon={IcoX} onClick={()=>go('/register')}>Register X</Btn>}
          {connected && <Btn kind="ghost" size="sm" icon={IcoLogout} onClick={()=>{user.disconnect(); notify('Logged out.'); go('/');}}>Log out</Btn>}
        </div>

        {!connected ? (
          <div className="empty-state">
            <h3>Connect to see your dashboard</h3>
            <p>Connect a wallet to track your SHO trading positions, or register your X account to track shilling. Claimable rewards, positions, and history will show up here.</p>
            <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:16,flexWrap:'wrap'}}>
              <Btn icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn>
              <Btn kind="outline" icon={IcoX} onClick={()=>go('/register')}>Register X</Btn>
            </div>
          </div>
        ) : (
          <>
            <div className="profile-stats">
              <div className="stat-tile"><IcoCoins size={20}/><div><StatNum value={totalClaimedUsd} format={fmtUSD}/><span className="lbl">Total claimed</span></div></div>
              <div className="stat-tile accent"><IcoCheckCirc size={20}/><div><StatNum value={totalClaimableUsd} format={fmtUSD}/><span className="lbl">Claimable now</span></div></div>
              <div className="stat-tile"><IcoTarget size={20}/><div><StatNum value={activeCount} format={v=>Math.round(v)}/><span className="lbl">Active positions</span></div></div>
              <div className="stat-tile"><IcoFlask size={20}/><div><StatNum value={createdCount} format={v=>Math.round(v)}/><span className="lbl">Campaigns created</span></div></div>
            </div>

            {claimable.length>0 && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoCheckCirc size={13}/>Claimable now</div>
                <div className="claim-list">
                  {claimable.map((it,i)=>(
                    <div key={i} className="claim-row" onClick={it.open}>
                      <div>
                        <div style={{fontWeight:600,fontSize:13.5,display:'flex',alignItems:'center',gap:8}}>{it.label} <Tag kind={it.kind}>{it.kind==='sho'?'SHO':'SSO'}</Tag></div>
                        <div className="camp-meta">{it.sub}</div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:14}}>
                        <div style={{textAlign:'right'}}>
                          <div className="mono" style={{fontWeight:600}}>{fmtNum(it.amount)} {it.denom}</div>
                          <div className="camp-meta">{fmtUSD(it.usd)}</div>
                        </div>
                        <Btn size="sm" icon={IcoCheckCirc} onClick={(e)=>{e.stopPropagation(); notify(`Claim submitted for ${it.label} (mock).`);}}>Claim</Btn>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {shoPositions.length>0 && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoTrendUp size={13}/>My SHO positions</div>
                <div className="scroll-x">
                  <table className="lb-table">
                    <thead><tr><th>Campaign</th><th>Rank</th><th>Net-buy volume</th><th>Status</th></tr></thead>
                    <tbody>
                      {shoPositions.map(p=>(
                        <tr key={p.campaignId} style={{cursor:'pointer'}} onClick={()=>go(`/sho/${p.campaignId}`)}>
                          <td>{p.c.token}</td>
                          <td className="rank">#{p.rank}</td>
                          <td className="mono">{fmtUSD(p.volume)}</td>
                          <td>{p.claimable ? <Tag kind="sho" icon={IcoCheckCirc}>Claimable</Tag> : <Tag kind="neutral" icon={IcoClock}>Tracking</Tag>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {ssoPositions.length>0 && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoMegaphone size={13}/>My SSO positions</div>
                <div className="scroll-x">
                  <table className="lb-table">
                    <thead><tr><th>Campaign</th><th>Rank</th><th>Engagement score</th><th>Status</th></tr></thead>
                    <tbody>
                      {ssoPositions.map(p=>(
                        <tr key={p.campaignId} style={{cursor:'pointer'}} onClick={()=>go(`/sso/${p.campaignId}`)}>
                          <td>{p.c.token}</td>
                          <td className="rank">#{p.rank}</td>
                          <td className="mono">{fmtNum(p.score)}</td>
                          <td>{p.claimable ? <Tag kind="sso" icon={IcoCheckCirc}>Claimable</Tag> : <Tag kind="neutral" icon={IcoClock}>Tracking</Tag>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {(createdSho.length>0 || createdSso.length>0) && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:14,display:'flex',alignItems:'center',gap:6}}><IcoFlask size={13}/>My created campaigns</div>
                <div className="created-grid">
                  {createdSho.map(c=>{
                    const distributedBps = c.milestones.filter(m=>m.status==='claimed'||m.status==='claimable').reduce((s,m)=>s+m.bps,0);
                    return (
                      <div key={c.id} className="created-card" onClick={()=>go(`/sho/${c.id}`)}>
                        <div className="camp-card-top">
                          <div><div className="ticker">{c.token}</div><div className="camp-meta">SHO &middot; {c.window} window</div></div>
                          <Tag kind="sho">Active</Tag>
                        </div>
                        <div className="kv"><span className="k">Locked</span><span className="v">{fmtNum(c.locked)} {c.token}</span></div>
                        <div className="kv"><span className="k">Distributed</span><span className="v">{distributedBps/100}%</span></div>
                        <div className="kv"><span className="k">Remaining</span><span className="v">{fmtNum(Math.round(c.locked*(10000-distributedBps)/10000))} {c.token}</span></div>
                      </div>
                    );
                  })}
                  {createdSso.map(c=>{
                    const distributedEpochs = c.epochs.filter(e=>e.status==='claimed'||e.status==='claimable').length;
                    const distributedBps = Math.round(10000*distributedEpochs/c.epochs.length);
                    return (
                      <div key={c.id} className="created-card" onClick={()=>go(`/sso/${c.id}`)}>
                        <div className="camp-card-top">
                          <div><div className="ticker">{c.token}</div><div className="camp-meta">SSO &middot; {c.epochLen} epochs</div></div>
                          <Tag kind="sso">Active</Tag>
                        </div>
                        <div className="kv"><span className="k">Locked</span><span className="v">{fmtNum(c.locked)} {c.denom}</span></div>
                        <div className="kv"><span className="k">Distributed</span><span className="v">{distributedBps/100}%</span></div>
                        <div className="kv"><span className="k">Remaining</span><span className="v">{fmtNum(Math.round(c.locked*(10000-distributedBps)/10000))} {c.denom}</span></div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {history.length>0 && (
              <div className="panel" style={{marginTop:22}}>
                <div className="eyebrow" style={{marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IcoTrophy size={13}/>Claim history</div>
                <div className="scroll-x">
                  <table className="lb-table">
                    <thead><tr><th>Date</th><th>Campaign</th><th>Reward</th><th>Amount</th></tr></thead>
                    <tbody>
                      {history.map((h,i)=>{
                        const c = h.kind==='sho' ? SHO_CAMPAIGNS.find(x=>x.id===h.campaignId) : SSO_CAMPAIGNS.find(x=>x.id===h.campaignId);
                        return (
                          <tr key={i}>
                            <td className="mono" style={{fontSize:12}}>{h.date}</td>
                            <td><span style={{display:'inline-flex',alignItems:'center',gap:8}}>{c ? c.token : h.campaignId} <Tag kind={h.kind}>{h.kind==='sho'?'SHO':'SSO'}</Tag></span></td>
                            <td className="camp-meta">{h.label}</td>
                            <td className="mono">{fmtNum(h.amount)} {h.token} <span className="camp-meta">({fmtUSD(h.usd)})</span></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ===================== APP SHELL ===================== */

function TopNav({route, go, theme, setTheme, user}){
  const is = (p)=> route===p || route.startsWith(p+'/');
  return (
    <div className="topnav">
      <div className="topnav-inner">
        <button className="brand" onClick={()=>go('/')}>
          <span className="brand-mark"><IcoLock size={14} sw={2}/></span>
          <span className="brand-word">Strong Commitment Protocol</span>
        </button>
        <div className="nav-links">
          <button className={`nav-link ${is('/sho')?'active':''}`} onClick={()=>go('/sho')}><IcoTrendUp size={13}/>SHO</button>
          <button className={`nav-link ${is('/sso')?'active':''}`} onClick={()=>go('/sso')}><IcoMegaphone size={13}/>SSO</button>
        </div>
        <div className="nav-right">
          <button className="theme-toggle" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} title="Toggle theme" aria-label="Toggle theme">
            {theme==='dark' ? '☀' : '☽'}
          </button>
          {user.xhandle
            ? <button className={`nav-chip ${is('/profile')?'active':''}`} onClick={()=>go('/profile')}><IcoCheckCirc size={12}/>{user.xhandle}</button>
            : <Btn kind="outline" size="sm" icon={IcoX} onClick={()=>go('/register')}>Register X</Btn>}
          {user.wallet
            ? <button className={`nav-chip mono ${is('/profile')?'active':''}`} onClick={()=>go('/profile')}><IcoWallet size={12}/>{user.wallet}</button>
            : <Btn size="sm" icon={IcoWallet} onClick={user.connectWallet}>Connect wallet</Btn>}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [route,go] = useHashRoute();
  const user = useMockUser();
  const [theme,setTheme] = useState(()=> localStorage.getItem('so_theme') || 'dark');
  const [toast,setToast] = useState(null);
  const notify = (m)=> setToast(m);

  useEffect(()=>{
    const root = document.documentElement;
    if(theme==='auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', theme);
    if(theme!=='auto') localStorage.setItem('so_theme', theme); else localStorage.removeItem('so_theme');
  },[theme]);

  let view;
  const parts = route.split('/').filter(Boolean);
  if(route==='/' ) view = <Landing go={go}/>;
  else if(parts[0]==='sho' && parts[1]==='create') view = <CreateWizard kind="sho" go={go} user={user} notify={notify}/>;
  else if(parts[0]==='sso' && parts[1]==='create') view = <CreateWizard kind="sso" go={go} user={user} notify={notify}/>;
  else if(parts[0]==='sho' && parts[1]) view = <SHODetail id={parts[1]} go={go} user={user} notify={notify}/>;
  else if(parts[0]==='sso' && parts[1]) view = <SSODetail id={parts[1]} go={go} user={user} notify={notify}/>;
  else if(parts[0]==='sho') view = <Discover kind="sho" go={go}/>;
  else if(parts[0]==='sso') view = <Discover kind="sso" go={go}/>;
  else if(parts[0]==='register') view = <Register go={go} user={user} notify={notify}/>;
  else if(parts[0]==='profile') view = <Profile go={go} user={user} notify={notify}/>;
  else view = <Landing go={go}/>;

  return (
    <>
      <TopNav route={route} go={go} theme={theme==='auto'?'dark':theme} setTheme={setTheme} user={user}/>
      {view}
      {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
