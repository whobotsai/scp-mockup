# Local Postgres for development only. Matches .env.example's DATABASE_URL defaults.
# Run: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keeper
      POSTGRES_PASSWORD: keeper
      POSTGRES_DB: keeper
    ports:
      - "5432:5432"
    volumes:
      - keeper-postgres-data:/var/lib/postgresql/data

volumes:
  keeper-postgres-data:
