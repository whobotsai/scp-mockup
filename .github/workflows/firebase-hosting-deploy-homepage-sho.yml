name: Deploy homepage-sho to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'homepage-sho/**'
      - '.github/workflows/firebase-hosting-deploy-homepage-sho.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOMEPAGE_SHO }}'
          projectId: 'homepage-sho'
          entryPoint: './homepage-sho'
          channelId: live
